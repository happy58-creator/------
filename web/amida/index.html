<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="streamlit.js"></script>
<script src="amida.js"></script>
<script>
  // Streamlit から人数・名前・あそびかたを受けとる。round が変わったら、新しいゲームを始める。
  let game = null, lastRound = null;
  Streamlit.ready((args) => {
    if (game && args.round === lastRound) return;
    lastRound = args.round;
    if (game) game.destroy();
    window.amidaGame = game = new Amida(document.getElementById("app"), args);
  });
</script>
</body>
</html>
