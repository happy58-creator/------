<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; color: #3a2e39; font-family: "Zen Maru Gothic", sans-serif; }
    #app { padding: 4px 2px 8px; user-select: none; -webkit-user-select: none; }
    .ready { text-align: center; padding: 30px 0; }
    .ready h2 { margin: 0; }
    .num { font-size: 7rem; font-weight: 900; color: #ff4b4b; line-height: 1.2; }
    .bar { height: 14px; border-radius: 99px; background: #f1e4d4; overflow: hidden; }
    .bar div { height: 100%; width: 0; background: linear-gradient(90deg, #ffb347, #ff4b4b); }
    .left { text-align: center; margin: 6px 0 2px; font-weight: 700; }
    .score { text-align: center; font-size: 3.5rem; font-weight: 900; color: #ff4b4b; line-height: 1.2; }
    .score small { font-size: 1.3rem; }
    button {
      display: block; width: 100%; height: min(42vh, 380px); min-height: 220px; margin-top: 10px;
      border: 0; border-radius: 24px; background: #ff4b4b; color: #fff; font: inherit; font-size: 2rem; font-weight: 900;
      box-shadow: 0 8px 18px rgba(190, 45, 68, .24); cursor: pointer;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      transition: transform .05s;
    }
    button.pressed { transform: scale(.97); background: #e63e3e; }
    button:disabled { background: #b9aeb6; box-shadow: none; }
    .tip { text-align: center; font-size: .9rem; color: #6b5d68; margin-top: 8px; }
  </style>
</head>
<body>
<div id="app">
  <div class="ready" id="ready">
    <h2>準備はいい？</h2>
    <div class="num" id="count">3</div>
    <div class="tip" id="course"></div>
  </div>
  <div id="play" hidden>
    <div class="bar"><div id="fill"></div></div>
    <div class="left" id="left"></div>
    <div class="score"><span id="score">0</span><small> 回</small></div>
    <button id="hit">🔴 ここを連打！</button>
    <div class="tip">ボタンを押した回数を数えるよ。時間切れまでがんばろう！</div>
  </div>
</div>
<script src="streamlit.js"></script>
<script>
  // 回数はブラウザの中で数え、時間切れのときだけ結果を Streamlit に送る（押すたびに通信すると数えもれが出るため）
  const $ = (id) => document.getElementById(id);
  let started = false;

  function run(args) {
    const duration = Number(args.duration) || 10;
    $("course").textContent = `${duration}秒コースに挑戦！`;
    const countEnd = performance.now() + 3000;
    let start = 0, hits = 0, done = false;
    const timer = setInterval(() => (start ? tick() : countdown()), 50);

    function countdown() {
      const left = countEnd - performance.now();
      if (left > 0) {
        $("count").textContent = Math.ceil(left / 1000);
        return;
      }
      $("ready").hidden = true;
      $("play").hidden = false;
      start = performance.now();
      tick();
    }

    function tick() {
      const elapsed = (performance.now() - start) / 1000;
      const left = Math.max(0, duration - elapsed);
      $("fill").style.width = Math.min(100, (elapsed / duration) * 100) + "%";
      $("left").textContent = `残り ${left.toFixed(1)} 秒`;
      if (left > 0 || done) return;
      clearInterval(timer);
      done = true;
      $("hit").disabled = true;
      $("hit").textContent = "⏰ そこまで！";
      setTimeout(() => Streamlit.setValue({ round: args.round, clicks: hits }), 600);
    }

    // pointerdown なら、指をはなすのを待たずに すぐ数えられる
    $("hit").addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (done || !start) return;
      hits++;
      $("score").textContent = hits.toLocaleString();
      $("hit").classList.add("pressed");
    });
    const release = () => $("hit").classList.remove("pressed");
    $("hit").addEventListener("pointerup", release);
    $("hit").addEventListener("pointerleave", release);
    $("hit").addEventListener("contextmenu", (e) => e.preventDefault());
    countdown();
  }

  Streamlit.ready((args) => {
    if (started) return;
    started = true;
    run(args);
  });
</script>
</body>
</html>
