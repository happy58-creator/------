<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="bar">
    <div class="seg" id="modeSeg">
      <button data-v="cpu">🤖 CPUと対戦</button>
      <button data-v="pvp">👥 2人で対戦</button>
    </div>
    <div class="seg" id="colorSeg">
      <button data-v="w">白（先手）</button>
      <button data-v="b">黒（後手）</button>
    </div>
    <label class="level" id="levelBox">つよさ
      <select id="level">
        <option value="easy">かんたん</option>
        <option value="normal">ふつう</option>
        <option value="hard">つよい</option>
        <option value="expert">さいきょう</option>
      </select>
    </label>
    <button class="primary" id="newBtn">🆕 新しいゲーム</button>
  </div>
  <p class="note" id="note" hidden>「新しいゲーム」をおすと、えらんだ設定ではじまるよ。</p>

  <div class="main">
    <div class="board-col" id="boardCol">
      <div class="cap" id="capTop"></div>
      <div class="board-row">
        <div class="evalbar" title="どっちが有利？（形勢）"><div class="fill" id="evalFill"></div></div>
        <div class="board" id="board"></div>
      </div>
      <div class="cap" id="capBottom"></div>

      <div class="overlay" id="promo" hidden>
        <div class="dialog">
          <p>ポーンが いちばん奥に ついた！<br>なにに なる？</p>
          <div class="promo-choices" id="promoChoices"></div>
        </div>
      </div>
      <div class="overlay" id="result" hidden>
        <div class="dialog">
          <div class="big" id="resultEmoji"></div>
          <p id="resultText"></p>
          <button class="primary" id="againBtn">🔄 もう一回あそぶ</button>
          <button id="viewBtn">👀 盤面を見る</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="status" id="status"></div>
      <div class="tools">
        <button id="undoBtn">↩️ 1手もどす</button>
        <button id="hintBtn">💡 ヒント</button>
        <button id="flipBtn">🔃 盤を回す</button>
        <button id="soundBtn">🔊 音</button>
      </div>
      <div class="explain" id="explain"></div>
      <div class="eval-text" id="evalText"></div>
      <h4>📜 これまでの手</h4>
      <div class="moves" id="moves"></div>
    </div>
  </div>
</div>
<script src="streamlit.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
