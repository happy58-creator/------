<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>story battle</title>
<style>
  :root { --gold:#e9d6a6; --ink:#f4ecda; --muted:#b9ab90; --enemy:#d8453c; --ally:#46c37b; --warn:#ffb347; }
  html, body { margin:0; background:transparent; color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif; }
  * { box-sizing:border-box; }
  #app { max-width:560px; margin:0 auto; padding:4px 4px 8px; touch-action:manipulation;
    background:#18141b; border-radius:16px; }
  .stage-no { text-align:center; font-size:13px; color:var(--muted); letter-spacing:.1em; padding-top:4px; }
  .bar-row { display:flex; align-items:center; gap:8px; margin:6px 2px; }
  .label { font-weight:700; font-size:15px; white-space:nowrap; text-shadow:0 1px 2px #000; }
  .hpbar { position:relative; flex:1; height:16px; border-radius:9px; background:#241d22;
    border:1px solid rgba(233,214,166,.35); overflow:hidden; }
  .hpbar .lag { position:absolute; inset:0 auto 0 0; background:#f0d080; transition:width .6s ease .15s; }
  .hpbar .fill { position:absolute; inset:0 auto 0 0; transition:width .08s linear; }
  #enemyBar .fill { background:linear-gradient(#ef6a5f,#b3271f); }
  #allyBar .fill  { background:linear-gradient(#6fe39d,#24894f); }
  #allyBar.low .fill { background:linear-gradient(#ffb070,#d1541f); }
  .num { font:700 14px/1 ui-monospace,Menlo,monospace; min-width:84px; text-align:right; text-shadow:0 1px 2px #000; }
  .charge { height:5px; margin:0 2px 6px; border-radius:3px; background:#2a2026; overflow:hidden; }
  .charge > div { height:100%; width:0; background:linear-gradient(90deg,#7a2a26,#ff5a4a); }
  .charge.hot > div { box-shadow:0 0 8px #ff5a4a; }

  .icon { width:44px; height:44px; border-radius:50%; object-fit:cover; flex:none;
    border:2px solid var(--gold); box-shadow:0 2px 6px rgba(0,0,0,.6); }
  .icon.hurt { animation:hurt .4s linear; }
  @keyframes hurt { 0%,100%{transform:translate(0,0);filter:none} 20%{transform:translate(-4px,1px);filter:sepia(1) saturate(6) hue-rotate(-30deg)}
    50%{transform:translate(4px,-1px);filter:sepia(1) saturate(6) hue-rotate(-30deg)} 80%{transform:translate(-2px,0)} }
  .ally-side { flex:1; min-width:0; }
  .ally-side .bar-row { margin:0; }

  #statusRow { display:flex; flex-wrap:wrap; gap:6px; min-height:24px; margin:6px 2px 0; }
  .chip { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:99px; font-size:13px;
    background:#2e2530; border:1px solid rgba(233,214,166,.25); }
  .chip.bad { background:#3a1f22; border-color:#a8433b; }
  .chip.good { background:#1d3326; border-color:#3f9a64; }
  .pips { display:inline-flex; gap:2px; }
  .pips i { width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.9; }

  #items { display:flex; flex-wrap:wrap; gap:6px; margin:8px 2px 0; }
  #items button { flex:1 1 30%; min-width:92px; min-height:44px; border-radius:10px; border:1px solid rgba(233,214,166,.35);
    background:#2b2330; color:var(--ink); font:700 13px/1.2 inherit; cursor:pointer; padding:4px 6px; }
  #items button:disabled { opacity:.35; cursor:default; }
  #items button:not(:disabled):active { transform:scale(.97); }
  #items .cnt { display:block; font-size:11px; color:var(--muted); font-weight:400; }

  #stage { position:relative; }
  #stage .st-target { cursor:crosshair; }
  #stage.shake { animation:shake .32s linear; }
  @keyframes shake { 0%,100%{transform:translate(0,0)} 20%{transform:translate(-6px,3px)} 40%{transform:translate(5px,-4px)} 60%{transform:translate(-4px,2px)} 80%{transform:translate(3px,-1px)} }
  .st-enemy.hit { filter:brightness(1.7) saturate(1.2); }
  .st-photo.hit { filter:brightness(1.18); }
  .flash { position:absolute; inset:0; border-radius:14px; pointer-events:none; z-index:20;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(220,30,20,.55) 100%); opacity:0; }
  .flash.on { animation:flash .45s ease-out; }
  .flash.meteor { background:radial-gradient(ellipse at center, rgba(255,160,40,.35) 10%, rgba(120,20,0,.75) 100%); }
  @keyframes flash { from{opacity:1} to{opacity:0} }
  .stun { position:absolute; inset:0; z-index:19; border-radius:14px; pointer-events:none; display:none;
    background:rgba(255,230,80,.12); box-shadow:inset 0 0 40px rgba(255,230,80,.55); }
  .stun.on { display:block; animation:stun .25s steps(2) infinite; }
  @keyframes stun { 50% { box-shadow:inset 0 0 24px rgba(255,255,160,.85); } }
  .banner { position:absolute; left:50%; top:10px; transform:translateX(-50%); z-index:22; pointer-events:none;
    padding:6px 14px; border-radius:99px; font-weight:900; font-size:16px; white-space:nowrap; display:none;
    background:rgba(60,10,0,.85); color:#ffb070; border:1px solid #ff7a3a; text-shadow:0 1px 2px #000; }
  .banner.on { display:block; animation:pulse .9s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 18px #ff7a3a; } }
  .pop { position:absolute; z-index:21; pointer-events:none; font:800 22px/1 ui-sans-serif,system-ui,sans-serif;
    color:#fff6d8; text-shadow:0 0 4px #000,0 2px 0 #7a4a00; transform:translate(-50%,-50%);
    animation:pop .7s ease-out forwards; }
  .pop.player { color:#ff6b5b; font-size:28px; text-shadow:0 0 6px #000; }
  .pop.dot { color:#d48cff; font-size:22px; }
  .pop.heal { color:#7dffb0; font-size:26px; }
  .pop.info { color:#ffe28a; font-size:20px; white-space:nowrap; }
  @keyframes pop { 0%{opacity:0;transform:translate(-50%,-30%) scale(.7)} 15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)} 100%{opacity:0;transform:translate(-50%,-160%) scale(1)} }
  .overlay { position:absolute; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:14px; pointer-events:none; text-align:center; }
  .overlay .big { font-size:min(26vw,120px); font-weight:900; color:var(--gold); text-shadow:0 4px 18px #000, 0 0 2px #000; }
  .overlay .msg { font-size:min(9vw,40px); font-weight:900; letter-spacing:.08em; text-shadow:0 4px 18px #000, 0 0 2px #000; }
  .overlay.dim { background:rgba(0,0,0,.45); }
  .overlay.win .msg { color:#ffe28a; }
  .overlay.lose .msg { color:#ff7a6e; }
  .overlay .sub { margin-top:8px; font-size:16px; color:var(--ink); text-shadow:0 2px 6px #000; }
  .footer { display:flex; justify-content:space-between; align-items:center; margin:8px 4px 0; font-size:13px; color:var(--muted); }
  #quit { border:1px solid rgba(233,214,166,.3); background:transparent; color:var(--muted); border-radius:8px;
    padding:6px 10px; font:700 12px inherit; cursor:pointer; }
  #quit.armed { background:#7a2620; color:#fff; border-color:#ff7a6e; }
  .hint { text-align:center; font-size:13px; color:var(--muted); margin-top:4px; min-height:1em; }
</style>
<style id="sceneCss"></style>
</head>
<body>
<div id="app">
  <div class="stage-no" id="stageNo"></div>
  <div class="bar-row">
    <span class="label" id="enemyName"></span>
    <div class="hpbar" id="enemyBar"><div class="lag"></div><div class="fill"></div></div>
    <span class="num" id="enemyNum"></span>
  </div>
  <div class="charge" id="charge" title="敵の攻撃までの時間"><div></div></div>
  <div id="stage"></div>
  <div class="bar-row" style="margin-top:10px">
    <img class="icon" id="allyIcon" alt="">
    <div class="ally-side">
      <div class="label" id="allyName" style="margin-bottom:4px"></div>
      <div class="bar-row">
        <div class="hpbar" id="allyBar"><div class="lag"></div><div class="fill"></div></div>
        <span class="num" id="allyNum"></span>
      </div>
    </div>
  </div>
  <div id="statusRow"></div>
  <div id="items"></div>
  <div class="footer"><span id="tapInfo">ヒット 0</span><span id="timeInfo">0.0秒</span><button id="quit" type="button">🏳️ やめる</button></div>
  <div class="hint" id="hint">敵をタップして攻撃！</div>
</div>
<script>
"use strict";
// ---------------------------------------------------------------------------
// Streamlit とのやりとり（公式の component-lib を使わない最小実装）
// ---------------------------------------------------------------------------
const Streamlit = {
  send(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*"); },
  ready() { this.send("streamlit:componentReady", { apiVersion: 1 }); },
  setHeight() { this.send("streamlit:setFrameHeight", { height: Math.ceil(document.documentElement.getBoundingClientRect().height) }); },
  setValue(value) { this.send("streamlit:setComponentValue", { value, dataType: "json" }); },
};
window.addEventListener("message", (ev) => {
  const d = ev.data;
  if (d && d.type === "streamlit:render") {
    const a = d.args;
    start(a.config, a.scene_html, a.scene_css, a.hit_mask, a.ally_icon);
  }
});
new ResizeObserver(() => Streamlit.setHeight()).observe(document.body);

// ---------------------------------------------------------------------------
// 戦闘
//   数字（ダメージ・回復量など）は Python（story_logic.py）で計算したものを使い、ここでは計算しない。
// ---------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const DOTS = ["poison", "fire", "black_flame"];   // 毎ターンダメージを受ける状態異常
let G = null;   // いまの戦闘の状態

function displayHp(hp) { return hp <= 0 ? 0 : Math.max(1, Math.round(hp)); }
function fmtDamage(v) { return v < 10 ? v.toFixed(1).replace(/\.0$/, "") : String(Math.round(v)); }
function randInt(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }

function start(config, sceneHtml, sceneCss, hitMask, allyIcon) {
  if (G && G.round === config.round) return;          // 同じ戦闘の再描画は無視（途中から始め直さない）
  $("sceneCss").textContent = sceneCss;
  $("stage").innerHTML = sceneHtml +
    '<div class="stun" id="stun"></div><div class="flash" id="flash"></div><div class="banner" id="banner"></div>';
  G = {
    round: config.round, cfg: config,
    enemyHp: config.enemy.max_hp, allyHp: config.ally.hp,
    phase: "countdown", startAt: 0, lastAttack: 0, pausedAt: 0,
    taps: 0, hits: 0, misses: 0, dealt: 0, taken: 0, enemyAttacks: 0,
    hitMask: null,
    status: { poison: 0, fire: 0, black_flame: 0, thunder: 0 },   // 残りターン
    guard: 0,                                                      // 防御アップの残りターン
    meteorPending: false, meteorUsed: false,
    items: Object.fromEntries(config.items.map((i) => [i.id, i.count])), used: {},
  };
  $("stageNo").textContent = `ステージ ${config.stage} / ${config.stage_count}`;
  $("enemyName").textContent = `Lv.${config.enemy.lv} ${config.enemy.name}`;
  $("allyName").textContent = config.ally.name.split("、").pop();
  $("allyIcon").src = allyIcon || "";
  $("hint").textContent = "敵をタップして攻撃！";
  prepareHitMask(hitMask);
  bindTaps();
  bindQuit();
  renderItems();
  renderStatus();
  updateBars();
  Streamlit.setHeight();
  countdown(config.countdown);
}

// 当たり判定：敵の形をした白黒の「当たりマスク」画像を使う（白い部分だけが当たり）。
// 背景つきの画像（Lv.5〜8・10）でも、背景をタップしたらノーヒットになる。
function prepareHitMask(maskUri) {
  if (!maskUri) return;
  const m = new Image();
  m.onload = () => {
    const c = document.createElement("canvas"); c.width = m.naturalWidth; c.height = m.naturalHeight;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(m, 0, 0);
    G.hitMask = { w: c.width, h: c.height, data: ctx.getImageData(0, 0, c.width, c.height).data };
  };
  m.src = maskUri;
}

function isOnEnemy(img, clientX, clientY) {
  if (!G.hitMask) return true;                     // マスクがまだ読めていないときは画像全体を当たりにする
  const r = img.getBoundingClientRect();
  const nw = img.naturalWidth, nh = img.naturalHeight;
  // 実際に絵が描かれている範囲（敵だけの画像は contain + 下寄せ、背景つきの画像は cover + 中央）
  const cover = img.classList.contains("st-photo");
  const scale = cover ? Math.max(r.width / nw, r.height / nh) : Math.min(r.width / nw, r.height / nh);
  const dw = nw * scale, dh = nh * scale;
  const ox = r.left + (r.width - dw) / 2, oy = cover ? r.top + (r.height - dh) / 2 : r.top + (r.height - dh);
  const u = (clientX - ox) / dw, v = (clientY - oy) / dh;
  if (u < 0 || u >= 1 || v < 0 || v >= 1) return false;
  const m = G.hitMask, x = Math.floor(u * m.w), y = Math.floor(v * m.h);
  // 指の太さぶん、周り（±1マス）に敵がいれば当たりにする
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const xx = x + dx, yy = y + dy;
    if (xx >= 0 && yy >= 0 && xx < m.w && yy < m.h && m.data[(yy * m.w + xx) * 4] > 127) return true;
  }
  return false;
}

function bindTaps() {
  const stage = $("stage");
  stage.onpointerdown = (ev) => {
    ev.preventDefault();
    if (!G || G.phase !== "fight") return;
    if (G.status.thunder > 0) {                         // 雷：しびれてタップできない
      popNumber(ev.clientX, ev.clientY, "しびれて動けない！", "info");
      return;
    }
    G.taps++;
    const img = stage.querySelector(".st-target");
    const onEnemy = ev.target === img && isOnEnemy(img, ev.clientX, ev.clientY);
    if (!onEnemy) { G.misses++; updateBars(); return; }  // 敵以外はノーヒット
    const dmg = Math.min(G.cfg.ally.tap_damage, G.enemyHp);
    G.enemyHp -= dmg; G.dealt += dmg; G.hits++;
    popNumber(ev.clientX, ev.clientY, fmtDamage(G.cfg.ally.tap_damage), "");
    img.classList.add("hit"); clearTimeout(img._t); img._t = setTimeout(() => img.classList.remove("hit"), 70);
    updateBars();
    if (G.enemyHp <= 1e-9) { finish("win"); return; }
    // メテオ：HPが半分を切ったら予告を出し、次の攻撃をメテオにする（1回だけ）
    if (G.cfg.enemy.meteor && !G.meteorUsed && !G.meteorPending &&
        G.enemyHp < G.cfg.enemy.max_hp * G.cfg.meteor.trigger_rate) {
      G.meteorPending = true;
      $("banner").textContent = "☄️ メテオの詠唱… 次の攻撃に備えよう！";
      $("banner").classList.add("on");
    }
  };
  stage.oncontextmenu = (ev) => ev.preventDefault();
}

// やめる：2回押すとやめる（1回目は確認）。負けと同じ扱い
function bindQuit() {
  const b = $("quit");
  b.classList.remove("armed"); b.textContent = "🏳️ やめる";
  b.onclick = () => {
    if (!G || G.phase === "end") return;
    if (!b.classList.contains("armed")) {
      b.classList.add("armed"); b.textContent = "もう一度押すと やめる（負けと同じ）";
      clearTimeout(b._t); b._t = setTimeout(() => { b.classList.remove("armed"); b.textContent = "🏳️ やめる"; }, 3000);
      return;
    }
    finish("quit");
  };
}

// ---------------------------------------------------------------------------
// アイテム（雷でタップできない間も使える）
// ---------------------------------------------------------------------------
function renderItems() {
  const box = $("items");
  box.innerHTML = "";
  for (const item of G.cfg.items) {
    if (!G.items[item.id] && !G.used[item.id]) continue;   // 持っていない物は出さない
    const b = document.createElement("button");
    b.type = "button";
    b.disabled = G.phase !== "fight" || !G.items[item.id];
    b.innerHTML = `${item.icon} ${item.name}<span class="cnt">のこり ${G.items[item.id]}</span>`;
    b.onclick = () => useItem(item);
    box.appendChild(b);
  }
  Streamlit.setHeight();
}

function useItem(item) {
  if (G.phase !== "fight" || !G.items[item.id]) return;
  G.items[item.id]--; G.used[item.id] = (G.used[item.id] || 0) + 1;
  const r = $("stage").getBoundingClientRect();
  if (item.heal > 0) {
    G.allyHp = Math.min(G.cfg.ally.max_hp, G.allyHp + item.heal);
    popNumber(r.left + r.width / 2, r.top + r.height * 0.75, "+" + fmtDamage(item.heal), "heal");
  }
  if (item.cure) { for (const k in G.status) G.status[k] = 0; }
  if (item.guard > 0) {
    G.guard = item.guard;
    popNumber(r.left + r.width / 2, r.top + r.height * 0.62, "🛡️ 防御アップ！", "info");
  }
  renderItems(); renderStatus(); updateBars();
}

function renderStatus() {
  const row = $("statusRow");
  row.innerHTML = "";
  const chip = (icon, name, turns, cls) => {
    const el = document.createElement("span");
    el.className = "chip " + cls;
    el.innerHTML = `${icon} ${name} <span class="pips">${"<i></i>".repeat(Math.max(0, turns))}</span>`;
    row.appendChild(el);
  };
  for (const id of ["thunder", ...DOTS]) {
    if (G.status[id] > 0) chip(G.cfg.status[id].icon, G.cfg.status[id].name, G.status[id], "bad");
  }
  if (G.guard > 0) chip("🛡️", "防御アップ", G.guard, "good");
  $("stun").classList.toggle("on", G.status.thunder > 0);
  $("hint").textContent = G.phase !== "fight" ? $("hint").textContent
    : G.status.thunder > 0 ? "⚡ しびれて動けない！ アイテムは使えるよ" : "敵をタップして攻撃！";
}

function popNumber(clientX, clientY, text, cls) {
  const s = $("stage").getBoundingClientRect();
  const el = document.createElement("div");
  el.className = "pop " + cls; el.textContent = text;
  el.style.left = (clientX - s.left + (Math.random() - .5) * 18) + "px";
  el.style.top = (clientY - s.top) + "px";
  $("stage").appendChild(el);
  setTimeout(() => el.remove(), 720);
}

function updateBars() {
  const e = G.cfg.enemy, a = G.cfg.ally;
  const ep = Math.max(0, G.enemyHp / e.max_hp) * 100, ap = Math.max(0, G.allyHp / a.max_hp) * 100;
  for (const [id, p] of [["enemyBar", ep], ["allyBar", ap]]) {
    $(id).querySelector(".fill").style.width = p + "%";
    $(id).querySelector(".lag").style.width = p + "%";
  }
  $("allyBar").classList.toggle("low", ap <= 30);
  $("enemyNum").textContent = `${displayHp(G.enemyHp).toLocaleString()} / ${Math.round(e.max_hp).toLocaleString()}`;
  $("allyNum").textContent = `${displayHp(G.allyHp)} / ${Math.round(a.max_hp)}`;
  $("tapInfo").textContent = `ヒット ${G.hits}` + (G.misses ? `（ミス ${G.misses}）` : "");
}

function overlay(html, cls) {
  let o = $("overlay");
  if (!o) { o = document.createElement("div"); o.id = "overlay"; $("stage").appendChild(o); }
  o.className = "overlay " + (cls || ""); o.innerHTML = html;
  o.style.display = html ? "flex" : "none";
}

function countdown(n) {
  overlay(`<div class="big">${n}</div>`, "dim");
  if (n > 0) { setTimeout(() => countdown(n - 1), 1000); return; }
  overlay(`<div class="msg">たたかえ！</div>`, "");
  setTimeout(() => overlay(""), 600);
  G.phase = "fight";
  G.startAt = G.lastAttack = performance.now();
  renderItems();
  requestAnimationFrame(tick);
}

// 画面が隠れている間（別のタブなど）は時間を止める
document.addEventListener("visibilitychange", () => {
  if (!G || G.phase !== "fight") return;
  if (document.hidden) G.pausedAt = performance.now();
  else if (G.pausedAt) { const d = performance.now() - G.pausedAt; G.startAt += d; G.lastAttack += d; G.pausedAt = 0; }
});

function tick(now) {
  if (!G || G.phase !== "fight") return;
  if (G.pausedAt) { requestAnimationFrame(tick); return; }
  const turn = G.cfg.turn_ms;
  const since = now - G.lastAttack;
  $("charge").firstElementChild.style.width = Math.min(100, since / turn * 100) + "%";
  $("charge").classList.toggle("hot", since > turn * 0.8);
  $("timeInfo").textContent = ((now - G.startAt) / 1000).toFixed(1) + "秒";
  if (since >= turn) {
    G.lastAttack += turn;
    enemyTurn();
    if (G.phase !== "fight") return;
  }
  requestAnimationFrame(tick);
}

function hurt(amount) {
  G.allyHp -= amount; G.taken += amount;
  const icon = $("allyIcon");
  icon.classList.remove("hurt"); void icon.offsetWidth; icon.classList.add("hurt");
}

// 1ターンの処理： 持続ダメージ → 敵の攻撃 → 新しい状態異常の抽選
function enemyTurn() {
  const r = $("stage").getBoundingClientRect();
  // 1. 持続ダメージ（付けられたターンには入らず、次のターンから入る）
  let dotTotal = 0;
  for (const id of DOTS) {
    if (G.status[id] <= 0) continue;
    const st = G.cfg.status[id];
    dotTotal += G.guard > 0 ? st.damage_guard : st.damage;
    G.status[id]--;
  }
  if (dotTotal > 0) {
    hurt(dotTotal);
    popNumber(r.left + r.width * 0.3, r.top + r.height * 0.86, "-" + fmtDamage(dotTotal), "dot");
    updateBars();
    if (G.allyHp <= 1e-9) { renderStatus(); finish("lose"); return; }
  }
  if (G.status.thunder > 0) G.status.thunder--;     // 雷はターンが過ぎるたびに減る

  // 2. 敵の攻撃（メテオの予告が出ていればメテオに変わる）
  G.enemyAttacks++;
  const s = $("stage"), f = $("flash");
  s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake");
  f.classList.remove("on", "meteor"); void f.offsetWidth;
  if (G.meteorPending) {
    const dmg = G.allyHp * G.cfg.meteor.current_hp_rate;
    hurt(dmg);
    G.meteorPending = false; G.meteorUsed = true;
    $("banner").classList.remove("on");
    G.status.black_flame = G.cfg.status.black_flame.turns;
    f.classList.add("meteor", "on");
    popNumber(r.left + r.width / 2, r.top + r.height * 0.5, "☄️ メテオ！ -" + fmtDamage(dmg), "player");
  } else {
    const dmg = G.guard > 0 ? G.cfg.enemy.hit_damage_guard : G.cfg.enemy.hit_damage;
    hurt(dmg);
    f.classList.add("on");
    popNumber(r.left + r.width / 2, r.top + r.height * 0.82, "-" + fmtDamage(dmg), "player");
    // 3. 新しい状態異常の抽選（敵が持つ状態異常から1つ）
    const g = G.cfg.enemy.gimmicks;
    if (g.length && Math.random() < G.cfg.status_chance) inflict(g[randInt(0, g.length - 1)], r);
  }
  if (G.guard > 0) G.guard--;
  if (navigator.vibrate) navigator.vibrate(60);
  renderStatus();
  updateBars();
  if (G.allyHp <= 1e-9) finish("lose");
}

// 状態異常を付ける。同じ物は重ならず、残りターンが最初に戻る
function inflict(id, r) {
  const st = G.cfg.status[id];
  let turns = st.turns;
  if (id === "thunder") {
    turns = randInt(st.turns_min, st.turns_max);
    if (st.halve) turns = Math.ceil(turns / 2);       // 雷よけの指輪：ターン数を半分（切り上げ）
  }
  G.status[id] = turns;
  popNumber(r.left + r.width / 2, r.top + r.height * 0.68, `${st.icon} ${st.name}！`, "info");
}

function finish(result) {
  G.phase = "end";
  $("banner").classList.remove("on");
  $("stun").classList.remove("on");
  $("hint").textContent = "";
  renderItems();
  const elapsed = G.startAt ? performance.now() - G.startAt : 0;
  $("charge").firstElementChild.style.width = "0%";
  const html = result === "win"
    ? `<div class="msg">撃破！</div><div class="sub">${(elapsed / 1000).toFixed(1)}秒 ／ ${G.hits}ヒット</div>`
    : result === "lose"
      ? `<div class="msg">やられた…</div><div class="sub">敵の残りHP ${displayHp(G.enemyHp).toLocaleString()}</div>`
      : `<div class="msg">撤退…</div>`;
  overlay(html, "dim " + (result === "win" ? "win" : "lose"));
  const value = {
    round: G.round, result,
    ally_hp: Math.max(0, G.allyHp), enemy_hp: Math.max(0, G.enemyHp),
    taps: G.taps, hits: G.hits, misses: G.misses,
    damage_dealt: G.dealt, damage_taken: G.taken, enemy_attacks: G.enemyAttacks,
    elapsed_ms: Math.round(elapsed), used: G.used,
  };
  setTimeout(() => Streamlit.setValue(value), result === "quit" ? 500 : 1400);   // 結果の表示を少し見せてから Python に返す
}

Streamlit.ready();
</script>
</body>
</html>
