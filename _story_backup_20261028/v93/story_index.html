<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>story battle</title>
<style>
  :root { --gold:#e9d6a6; --ink:#f4ecda; --muted:#bfb196; --enemy:#e2453b; --ally:#46c37b; --panel:rgba(12,10,16,.82); }
  html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; touch-action:none; background:#07060a; color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  * { box-sizing:border-box; }
  /* 連打で画面がずれたり拡大したりしないように、スクロール・ピンチ・ダブルタップ拡大を止める（アイテムの一覧だけはスクロールできる） */
  #app { position:fixed; inset:0; touch-action:none; overscroll-behavior:none; -webkit-touch-callout:none; }
  #tapzone { touch-action:none; }

  /* 画面いっぱいの背景＋敵（story_assets.stage_html の中身） */
  #stage { position:absolute; inset:0; }
  #stage .st-scene { width:100%; height:100%; aspect-ratio:auto; border-radius:0; box-shadow:none; }
  #stage .st-enemy { height:min(74%, 120vw); bottom:19%; }
  #stage .st-enemy.floating { height:min(78%, 125vw); bottom:16%; }
  #stage .st-shadow { bottom:17.5%; }
  #stage .st-photo { top:9%; bottom:17%; left:0; width:100%; height:74%; }
  #stage.shake { animation:shake .38s linear; }
  @keyframes shake { 0%,100%{transform:translate(0,0)} 15%{transform:translate(-9px,4px)} 30%{transform:translate(8px,-5px)} 45%{transform:translate(-6px,3px)} 60%{transform:translate(5px,-2px)} 80%{transform:translate(-2px,1px)} }
  .st-target.hit { filter:brightness(1.6) saturate(1.2); }
  .st-target.struck { animation:struck .45s ease-out; }
  @keyframes struck { 0%{filter:brightness(3) saturate(0)} 40%{filter:brightness(1.6)} 100%{filter:none} }

  /* 上下の表示 */
  .hud { position:absolute; left:0; right:0; z-index:40; padding:10px max(12px, env(safe-area-inset-left)) 10px; pointer-events:none; }
  .hud.top { top:0; padding-top:max(10px, env(safe-area-inset-top));
    background:linear-gradient(to bottom, rgba(5,4,8,.88), rgba(5,4,8,.55) 70%, transparent); }
  .hud.bottom { bottom:0; padding-bottom:max(12px, env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(5,4,8,.94), rgba(5,4,8,.75) 70%, transparent); }
  .row { display:flex; align-items:center; gap:10px; max-width:720px; margin:0 auto; }
  .ename { font-weight:700; font-size:clamp(15px,4.2vw,20px); text-shadow:0 2px 4px #000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stageno { margin-left:auto; font-size:13px; color:var(--muted); white-space:nowrap; }
  .hpbar { position:relative; flex:1; height:14px; border-radius:8px; background:#221b21; border:1px solid rgba(233,214,166,.35); overflow:hidden; }
  .hpbar .lag { position:absolute; inset:0 auto 0 0; background:#f0d080; transition:width .7s ease .25s; }
  .hpbar .fill { position:absolute; inset:0 auto 0 0; transition:width .35s ease-out; }
  #enemyBar .fill { background:linear-gradient(#ef6a5f,#b3271f); }
  #allyBar .fill  { background:linear-gradient(#6fe39d,#24894f); }
  #allyBar.low .fill { background:linear-gradient(#ffb070,#d1541f); }
  .num { font:700 14px/1 ui-monospace,Menlo,monospace; min-width:92px; text-align:right; text-shadow:0 1px 3px #000; }
  .icon { width:52px; height:52px; flex:none; border-radius:50%; object-fit:cover; border:2px solid var(--gold); box-shadow:0 2px 8px rgba(0,0,0,.7); background:#1a1520; }
  .icon.low { border-color:#ff6b4a; box-shadow:0 0 12px rgba(255,90,60,.8); }
  .icon.hurt { animation:hurt .5s ease-out; }
  @keyframes hurt { 0%{transform:translateX(0);filter:none} 15%{transform:translateX(-6px);filter:sepia(1) saturate(7) hue-rotate(-35deg) brightness(.85)} 35%{transform:translateX(6px)} 55%{transform:translateX(-3px)} 100%{transform:none;filter:none} }
  .icon.down { filter:grayscale(1) brightness(.5); }
  .aname { font-weight:700; font-size:16px; text-shadow:0 2px 4px #000; }
  .ebadges { display:flex; flex-wrap:wrap; gap:6px; min-height:0; margin:6px auto 0; max-width:720px; align-items:center; }
  .ebadges .st-icon { width:30px; height:30px; }
  .st-icon.foe img { border:2px solid rgba(120,200,255,.9); }
  .pop.edot { color:#c9a2ff; font-size:30px; text-shadow:0 0 8px #000, 0 3px 0 #2a0050; }
  .pop.proc { color:#9fe0ff; font-size:24px; }
  /* 必殺技：アイコンの周りのチャージのゲージ。たまったら光って押せる */
  .skillwrap { position:relative; width:58px; height:58px; flex:none; display:grid; place-items:center; pointer-events:auto; }
  .skillwrap .sring { position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(#ffd36a calc(var(--p, 0) * 1%), rgba(255,255,255,.12) 0);
    -webkit-mask:radial-gradient(circle, transparent 25px, #000 26px); mask:radial-gradient(circle, transparent 25px, #000 26px); }
  .skillwrap .icon { width:50px; height:50px; }
  .skillwrap .ready { position:absolute; left:50%; bottom:-9px; transform:translateX(-50%); display:none; white-space:nowrap;
    font:800 10px/1 ui-sans-serif,system-ui,sans-serif; color:#1b120a; background:#ffd36a; padding:3px 6px; border-radius:99px; box-shadow:0 0 8px #ffd36a; }
  .skillwrap.full { cursor:pointer; }
  .skillwrap.full .sring { background:conic-gradient(#fff3b0 0 100%); animation:ringGlow 1s ease-in-out infinite; }
  .skillwrap.full .ready { display:block; }
  .skillwrap.full.can .icon { animation:iconPulse 1s ease-in-out infinite; }
  @keyframes ringGlow { 50% { filter:drop-shadow(0 0 10px #ffd36a) brightness(1.3); } }
  @keyframes iconPulse { 50% { transform:scale(1.08); box-shadow:0 0 18px #ffd36a; } }
  #cutin { position:absolute; inset:0; z-index:58; display:none; align-items:center; pointer-events:none; overflow:hidden; }
  #cutin .band { position:absolute; left:-10%; right:-10%; top:36%; height:24%; transform:skewY(-6deg);
    background:linear-gradient(90deg, transparent, rgba(10,6,16,.92) 15%, rgba(10,6,16,.92) 85%, transparent);
    border-top:2px solid var(--sc, #ffd36a); border-bottom:2px solid var(--sc, #ffd36a); animation:bandIn 1.15s ease-out forwards; }
  #cutin img { position:absolute; left:8%; top:33%; width:min(30vw,170px); height:min(30vw,170px); border-radius:50%; object-fit:cover;
    border:3px solid var(--sc, #ffd36a); box-shadow:0 0 30px var(--sc, #ffd36a); animation:cutImg 1.15s cubic-bezier(.2,1.2,.4,1) forwards; }
  #cutin .name { position:absolute; left:calc(12% + min(30vw,170px)); right:4%; top:43%; font-weight:900; font-size:clamp(24px,7.5vw,54px);
    color:#fff3cf; text-shadow:0 0 16px var(--sc, #ffd36a), 0 4px 0 #3a2000; white-space:nowrap; animation:cutName 1.15s ease-out forwards; }
  @keyframes bandIn { 0%{transform:skewY(-6deg) scaleY(0);opacity:0} 15%{transform:skewY(-6deg) scaleY(1);opacity:1} 85%{opacity:1} 100%{opacity:0} }
  @keyframes cutImg { 0%{transform:translateX(-60vw)} 25%{transform:translateX(0)} 85%{transform:translateX(4vw);opacity:1} 100%{transform:translateX(12vw);opacity:0} }
  @keyframes cutName { 0%{transform:translateX(60vw);opacity:0} 25%{transform:translateX(0);opacity:1} 85%{opacity:1} 100%{transform:translateX(-6vw);opacity:0} }
  /* 必殺技の演出の部品 */
  .bigslash { left:50%; top:45%; width:170vmax; height:26px; margin:-13px 0 0 -85vmax; border-radius:50%;
    background:linear-gradient(90deg, transparent, var(--c) 25%, #fff 50%, var(--c) 75%, transparent); box-shadow:0 0 40px var(--c), 0 0 90px var(--c);
    transform:rotate(-28deg); animation:bigslash .55s ease-out forwards; }
  @keyframes bigslash { 0%{transform:rotate(-28deg) scaleX(0);opacity:1} 50%{transform:rotate(-28deg) scaleX(1);opacity:1} 100%{transform:rotate(-28deg) scaleX(1.05) scaleY(.2);opacity:0} }
  .dome { left:50%; bottom:6%; width:90vmin; height:90vmin; margin-left:-45vmin; border-radius:50%;
    border:4px solid var(--c); background:radial-gradient(circle, transparent 55%, color-mix(in srgb, var(--c) 40%, transparent) 100%);
    box-shadow:0 0 40px var(--c), inset 0 0 40px var(--c); animation:dome 1.3s ease-out forwards; }
  @keyframes dome { 0%{transform:scale(.2);opacity:0} 30%{transform:scale(1);opacity:1} 80%{opacity:.9} 100%{transform:scale(1.05);opacity:0} }
  .rise { bottom:10%; width:10px; height:10px; border-radius:50%; background:var(--c); box-shadow:0 0 12px var(--c); animation:rise 1.2s ease-out forwards; }
  @keyframes rise { from{transform:translateY(0);opacity:1} to{transform:translateY(-55vh);opacity:0} }
  .circle { left:50%; top:45%; width:80vmin; height:80vmin; margin:-40vmin 0 0 -40vmin; border-radius:50%; border:3px dashed var(--c);
    box-shadow:0 0 30px var(--c), inset 0 0 30px var(--c); animation:circle 1.4s ease-out forwards; }
  .circle.in { width:56vmin; height:56vmin; margin:-28vmin 0 0 -28vmin; border-style:double; border-width:6px; animation-direction:normal; animation-name:circle2; }
  @keyframes circle { 0%{transform:rotate(0) scale(.3);opacity:0} 25%{opacity:1;transform:rotate(60deg) scale(1)} 80%{opacity:1} 100%{transform:rotate(200deg) scale(1);opacity:0} }
  @keyframes circle2 { 0%{transform:rotate(0) scale(.3);opacity:0} 25%{opacity:1;transform:rotate(-60deg) scale(1)} 80%{opacity:1} 100%{transform:rotate(-200deg) scale(1);opacity:0} }
  .glyph { top:-10%; font:900 clamp(26px,7vw,48px)/1 serif; color:var(--c); text-shadow:0 0 12px var(--c); animation:glyph 1.3s ease-in forwards; }
  @keyframes glyph { 0%{transform:translateY(0) rotate(0);opacity:0} 15%{opacity:1} 100%{transform:translateY(75vh) rotate(160deg);opacity:0} }
  .beam { left:-5%; top:calc(45% - 7vmin); width:110%; height:14vmin; border-radius:7vmin;
    background:linear-gradient(180deg, transparent, var(--c) 25%, #fff 50%, var(--c) 75%, transparent); box-shadow:0 0 50px var(--c);
    transform-origin:left center; animation:beam .95s ease-out forwards; }
  @keyframes beam { 0%{transform:scaleX(0);opacity:1} 35%{transform:scaleX(1);opacity:1} 75%{opacity:1} 100%{transform:scaleX(1) scaleY(.1);opacity:0} }
  .shard { left:50%; top:45%; width:0; height:0; border-left:9px solid transparent; border-right:9px solid transparent; border-bottom:22px solid var(--c);
    filter:drop-shadow(0 0 6px var(--c)); animation:shard 1s ease-out forwards; }
  @keyframes shard { from{transform:translate(0,0) rotate(0);opacity:1} to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0} }
  .crack { inset:0; background:repeating-conic-gradient(from 10deg at 50% 45%, transparent 0 14deg, rgba(255,255,255,.75) 14deg 14.6deg);
    -webkit-mask:radial-gradient(circle at 50% 45%, #000 0 30%, transparent 55%); mask:radial-gradient(circle at 50% 45%, #000 0 30%, transparent 55%);
    animation:flash .9s ease-out forwards; }
  .pillar { left:50%; top:-5%; width:34vmin; height:110%; margin-left:-17vmin;
    background:linear-gradient(90deg, transparent, var(--c) 20%, #fff 50%, var(--c) 80%, transparent); box-shadow:0 0 80px var(--c);
    transform-origin:top center; animation:pillar 1.5s ease-out forwards; mix-blend-mode:screen; }
  @keyframes pillar { 0%{transform:scaleY(0);opacity:1} 30%{transform:scaleY(1);opacity:1} 75%{opacity:1} 100%{transform:scaleY(1) scaleX(1.6);opacity:0} }
  .shout { left:50%; top:30%; transform:translateX(-50%); font:900 clamp(30px,10vw,72px)/1 sans-serif; color:#fff3c0;
    text-shadow:0 0 18px var(--c), 0 5px 0 #4a2600; white-space:nowrap; animation:shout 1.2s ease-out forwards; }
  @keyframes shout { 0%{transform:translateX(-50%) scale(2.4);opacity:0} 20%{transform:translateX(-50%) scale(1);opacity:1} 80%{opacity:1} 100%{transform:translateX(-50%) translateY(-6vh);opacity:0} }
  .badge.skill { color:#ffe28a; border-color:#ffd36a; }
  .badges { display:flex; flex-wrap:wrap; gap:8px; min-height:40px; margin:8px auto 0; max-width:720px; padding-left:62px; align-items:center; }
  /* 状態アイコン（毒・雷などの状態異常と、攻撃力アップ・防御アップ） */
  .st-icon { position:relative; width:38px; height:38px; flex:none; }
  .st-icon img { width:100%; height:100%; border-radius:50%; object-fit:cover; box-shadow:0 2px 8px rgba(0,0,0,.7); }
  .st-icon.buff img { border-radius:10px; border:2px solid rgba(255,220,140,.8); }
  .st-icon.bad img { border:2px solid rgba(255,90,80,.85); }
  .st-icon .t { position:absolute; right:-5px; bottom:-5px; min-width:19px; height:19px; padding:0 4px; border-radius:10px;
    background:#120d16; border:1px solid rgba(255,255,255,.55); font:800 12px/17px ui-sans-serif,system-ui,sans-serif; color:#fff; text-align:center; }
  .st-icon.new { animation:stIn .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes stIn { from{transform:scale(2.2);opacity:0} to{transform:scale(1);opacity:1} }
  .badge { font:600 12px/1 sans-serif; padding:4px 8px; border-radius:999px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); }
  .badge.atk { color:#ffcf8a; border-color:#ffb347; } .badge.guard { color:#9fd0ff; border-color:#6fb2ff; }
  .buttons { display:flex; gap:10px; max-width:720px; margin:10px auto 0; pointer-events:auto; }
  .btn { flex:1; min-height:58px; border-radius:14px; border:1px solid rgba(233,214,166,.6); color:#1b120a; font-weight:800; font-size:19px; line-height:1;
    font-family:inherit; letter-spacing:.06em; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.4); }
  .btn.attack { background:linear-gradient(#ffd98a,#e3a33f); }
  .btn.item { background:linear-gradient(#cfe6ff,#7aa9e0); flex:.7; }
  .btn:disabled { filter:grayscale(.8) brightness(.55); cursor:default; }
  .btn:not(:disabled):active { filter:brightness(1.15); }   /* 押したときに動かさない（はなした場所がずれてクリックにならないように） */
  #quit { position:absolute; z-index:60; top:max(8px, env(safe-area-inset-top)); right:10px; pointer-events:auto;
    font:600 12px/1 sans-serif; color:var(--muted); background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.2); border-radius:999px; padding:7px 11px; cursor:pointer; }
  .hud.top .row { padding-right:64px; }

  /* 連打中 */
  #tapzone { position:absolute; inset:0; z-index:30; display:none; }
  #tapzone.on { display:block; }
  #timer { position:absolute; z-index:45; left:50%; top:calc(max(10px, env(safe-area-inset-top)) + 64px); transform:translateX(-50%);
    width:min(70vw,420px); height:10px; border-radius:6px; background:rgba(0,0,0,.5); overflow:hidden; display:none; border:1px solid rgba(255,255,255,.3); }
  #timer > div { height:100%; width:100%; background:linear-gradient(90deg,#ffe28a,#ff8a3a); }
  #combo { position:absolute; z-index:45; right:6%; top:32%; text-align:right; display:none; pointer-events:none;
    text-shadow:0 3px 10px #000, 0 0 2px #000; }
  #combo .c { font:900 clamp(40px,12vw,84px)/1 ui-sans-serif,system-ui,sans-serif; color:#fff2c8; }
  #combo .d { font:800 clamp(16px,4.5vw,24px)/1.3 ui-sans-serif,system-ui,sans-serif; color:#ffcf6a; }
  .spark { position:absolute; z-index:44; width:46px; height:46px; margin:-23px 0 0 -23px; pointer-events:none; border-radius:50%;
    background:radial-gradient(circle, #fff 0 18%, rgba(255,230,150,.9) 30%, rgba(255,160,60,0) 70%); animation:spark .35s ease-out forwards; }
  .spark.miss { background:radial-gradient(circle, rgba(255,255,255,.5) 0 12%, transparent 60%); }
  @keyframes spark { from{transform:scale(.4);opacity:1} to{transform:scale(1.6);opacity:0} }

  /* 大きな文字・吹き出し・数字 */
  #banner { position:absolute; inset:0; z-index:50; display:none; align-items:center; justify-content:center; pointer-events:none; flex-direction:column; }
  #banner .t { font-weight:900; font-size:clamp(44px,14vw,110px); line-height:1; font-family:inherit; color:#fff0c4; letter-spacing:.06em;
    text-shadow:0 0 18px rgba(255,180,60,.8), 0 5px 0 #6b3a00, 0 10px 30px #000; animation:bannerIn .45s cubic-bezier(.2,1.6,.4,1); }
  #banner .s { margin-top:12px; font-size:18px; text-shadow:0 2px 8px #000; }
  #banner.win .t { color:#ffe28a; } #banner.lose .t { color:#ff8075; text-shadow:0 0 18px rgba(255,60,40,.7), 0 5px 0 #4a0a05, 0 10px 30px #000; }
  @keyframes bannerIn { from{transform:scale(2.2);opacity:0} to{transform:scale(1);opacity:1} }
  #bubble { position:absolute; z-index:48; left:50%; top:calc(max(10px, env(safe-area-inset-top)) + 70px); transform:translateX(-50%);
    width:max-content; max-width:min(86vw,520px); padding:12px 18px; border-radius:16px; background:rgba(14,10,18,.9); border:1px solid var(--bubble,#e9d6a6);
    box-shadow:0 0 18px var(--bubble,#e9d6a6), 0 6px 20px rgba(0,0,0,.6); font-size:clamp(16px,4.6vw,22px); font-weight:700; display:none; text-align:center; }
  #bubble::after { content:""; position:absolute; left:50%; bottom:-9px; width:16px; height:16px; transform:translateX(-50%) rotate(45deg);
    background:rgba(14,10,18,.9); border-right:1px solid var(--bubble,#e9d6a6); border-bottom:1px solid var(--bubble,#e9d6a6); }
  .pop { position:absolute; z-index:55; pointer-events:none; transform:translate(-50%,-50%); font:900 26px/1 ui-sans-serif,system-ui,sans-serif;
    color:#fff6d8; text-shadow:0 0 6px #000, 0 3px 0 #7a4a00; animation:pop 1s ease-out forwards; white-space:nowrap; }
  .pop.big { font-size:clamp(48px,15vw,104px); color:#fff3c0; text-shadow:0 0 20px rgba(255,170,40,.9), 0 6px 0 #7a3a00, 0 12px 30px #000; animation:popBig 1.3s ease-out forwards; }
  .pop.hurt { color:#ff6b5b; font-size:34px; text-shadow:0 0 8px #000, 0 3px 0 #4a0000; }
  .pop.heal { color:#7dffae; font-size:30px; text-shadow:0 0 8px #000, 0 3px 0 #004a20; }
  @keyframes pop { 0%{opacity:0;transform:translate(-50%,-30%) scale(.6)} 15%{opacity:1;transform:translate(-50%,-60%) scale(1.2)} 100%{opacity:0;transform:translate(-50%,-170%) scale(1)} }
  @keyframes popBig { 0%{opacity:0;transform:translate(-50%,-50%) scale(2.4)} 18%{opacity:1;transform:translate(-50%,-50%) scale(1)} 70%{opacity:1;transform:translate(-50%,-62%) scale(1)} 100%{opacity:0;transform:translate(-50%,-90%) scale(.9)} }

  /* エフェクトの層 */
  #fx { position:absolute; inset:0; z-index:35; pointer-events:none; overflow:hidden; }
  .fx { position:absolute; pointer-events:none; }
  .flash { inset:0; animation:flash .5s ease-out forwards; }
  @keyframes flash { from{opacity:1} to{opacity:0} }
  .slash { left:50%; top:45%; width:150vmax; height:10px; margin:-5px 0 0 -75vmax; border-radius:50%;
    background:linear-gradient(90deg, transparent, var(--c) 30%, #fff 50%, var(--c) 70%, transparent);
    box-shadow:0 0 18px var(--c), 0 0 40px var(--c); transform-origin:center; animation:slash .42s ease-out forwards; }
  @keyframes slash { 0%{transform:rotate(var(--r)) translate(var(--o)) scaleX(0);opacity:1} 45%{transform:rotate(var(--r)) translate(var(--o)) scaleX(1);opacity:1} 100%{transform:rotate(var(--r)) translate(var(--o)) scaleX(1.05);opacity:0} }
  .ring { left:50%; top:45%; width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%; border:6px solid var(--c);
    box-shadow:0 0 30px var(--c), inset 0 0 30px var(--c); animation:ring .7s ease-out forwards; }
  @keyframes ring { from{transform:scale(.2);opacity:1} to{transform:scale(var(--s,40));opacity:0} }
  .burst { left:50%; top:45%; width:60vmin; height:60vmin; margin:-30vmin 0 0 -30vmin; border-radius:50%;
    background:radial-gradient(circle, #fff 0 8%, var(--c) 22%, transparent 62%); animation:burst .6s ease-out forwards; mix-blend-mode:screen; }
  @keyframes burst { from{transform:scale(.2);opacity:1} to{transform:scale(1.8);opacity:0} }
  .particle { left:50%; top:45%; width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%; background:var(--c); box-shadow:0 0 10px var(--c);
    animation:particle .9s ease-out forwards; }
  @keyframes particle { from{transform:translate(0,0) scale(1);opacity:1} to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0} }
  .mist { top:20%; height:60%; width:70vw; left:-70vw; border-radius:50%; filter:blur(18px);
    background:radial-gradient(ellipse, var(--c), transparent 70%); animation:mist .8s ease-in-out forwards; opacity:.85; }
  @keyframes mist { to{transform:translateX(170vw)} }
  .flame { bottom:-10%; width:30vw; height:60vh; border-radius:50% 50% 40% 40%; filter:blur(10px); mix-blend-mode:screen;
    background:radial-gradient(ellipse at 50% 80%, #fff3b0 0 10%, var(--c) 35%, rgba(200,40,0,.6) 60%, transparent 75%); animation:flame .9s ease-out forwards; }
  @keyframes flame { 0%{transform:translateY(40%) scaleY(.4);opacity:0} 30%{opacity:1} 100%{transform:translateY(-30%) scaleY(1.2);opacity:0} }
  .svgfx { inset:0; width:100%; height:100%; }

<script>
"use strict";
// 軽いタップ・クリックでも必ず反応させる：押した場所とはなした場所がほぼ同じなら、はなした瞬間にクリック扱いにする
// （トラックパッドの軽いタップや、指が少しずれたタップで click が出ないことがあるため。あとから来る本物の click は無視して二重にしない）
(function fastTap() {
  const SEL = "button, .cand, #skillWrap, [data-tip]";
  let down = null, quietUntil = 0;
  document.addEventListener("pointerdown", (e) => {
    const el = e.target.closest && e.target.closest(SEL);
    down = el && !el.disabled ? { el, x: e.clientX, y: e.clientY, t: performance.now() } : null;
  }, true);
  document.addEventListener("pointerup", (e) => {
    const d = down; down = null;
    if (!d || d.el.disabled || !d.el.isConnected) return;
    if (performance.now() - d.t > 900 || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 16) return;
    quietUntil = performance.now() + 450;
    d.el.click();
  }, true);
  document.addEventListener("pointercancel", () => { down = null; }, true);
  document.addEventListener("click", (e) => {
    if (e.isTrusted && performance.now() < quietUntil && e.detail !== 0) { e.preventDefault(); e.stopImmediatePropagation(); }
  }, true);
})();
// 連打中に画面が動かないように：スクロールできる箱（.scroll）の中以外では、指の移動・ピンチ・ダブルタップ拡大を止める
(function lockGestures() {
  const inScroll = (t) => t && t.closest && t.closest(".scroll");
  document.addEventListener("touchmove", (e) => { if (e.touches.length > 1 || !inScroll(e.target)) e.preventDefault(); }, { passive: false });
  document.addEventListener("touchstart", (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  for (const g of ["gesturestart", "gesturechange", "gestureend"]) document.addEventListener(g, (e) => e.preventDefault(), { passive: false });
  document.addEventListener("dblclick", (e) => e.preventDefault(), { passive: false });
  document.addEventListener("contextmenu", (e) => e.preventDefault());
})();
// ---------------------------------------------------------------------------
// Streamlit とのやりとり（公式の component-lib を使わない最小実装）
// ---------------------------------------------------------------------------
const Streamlit = {
  send(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*"); },
  ready() { this.send("streamlit:componentReady", { apiVersion: 1 }); },
  setHeight(h) { this.send("streamlit:setFrameHeight", { height: h }); },
  setValue(value) { this.send("streamlit:setComponentValue", { value, dataType: "json" }); },
};
window.addEventListener("message", (ev) => {
  const d = ev.data;
  if (d && d.type === "streamlit:render") start(d.args);
});

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
function displayHp(hp) { return hp <= 0 ? 0 : Math.max(1, Math.round(hp)); }
function fmt(v) { return v < 10 ? (Math.round(v * 10) / 10).toString() : Math.round(v).toLocaleString(); }

let G = null;   // いまの戦闘の状態

// ---------------------------------------------------------------------------
// 開始
// ---------------------------------------------------------------------------
function start(args) {
  const c = args.config;
  if (G && G.round === c.round) return;          // 同じ戦闘の再描画は無視（途中から始め直さない）
  $("sceneCss").textContent = args.scene_css;
  $("stage").innerHTML = args.scene_html;
  G = {
    round: c.round, cfg: c, enemyHp: c.enemy.max_hp, allyHp: c.ally.hp,
    phase: "intro", turn: 0, usedItem: false, atkTurns: 0, guardTurns: 0,
    bag: Object.fromEntries(c.items.map((i) => [i.id, i.count])), used: {},
    taps: 0, hits: 0, misses: 0, dealt: 0, taken: 0, startAt: performance.now(), hitMask: null,
    tapHits: 0, tapDamage: 0, icons: args.item_icons || {}, statusIcons: args.status_icons || {}, equipIcons: args.equip_icons || {},
    status: { poison: 0, fire: 0, black_flame: 0, thunder: 0, darkness: 0, shadow: 0, freeze: 0, wind: 0 },   // 残りターン
    // 魔法・会心
    mp: c.ally.mp != null ? c.ally.mp : (c.ally.max_mp || 0), usedMp: 0, crits: 0, chantTaps: 0, casts: 0,
    critTurns: 0, critBonus: 0, magTurns: 0, magMult: 1, hasteItemTurns: 0, hasteItemMs: 0, hasteSpellTurns: 0, hasteSpellMs: 0,
    braveTurns: 0, braveMult: 1,
    // 剣の属性で敵にかかった状態異常
    eDots: {},                                   // { poison: [ターンごとのダメージ, ...] } 先頭から1つずつ入る
    eStatus: { thunder: 0, darkness: 0, darkMult: 1, shadow: 0 },
    // 必殺技
    charge: (c.skill && c.skill.start) || 0, skillUsed: false, boost: 1, barrier: 0, eBreak: 0, ward: 0,
    meteorPending: false, meteorUsed: false, enemyAttacks: 0,
    // 宇宙龍の覚醒
    awakened: false, specialNext: false, awakenArgs: c.awaken ? {
      scene: args.awaken_scene_html, mask: args.awaken_hit_mask, special: args.awaken_special_image } : null,
  };
  $("special").style.display = "none";
  if (args.awaken_special_image) { $("special").querySelector("img.main").src = args.awaken_special_image; $("special").querySelector("img.bg").src = args.awaken_special_image; }   // 先に読みこんでおく
  G.assistImages = args.assist_images || null;           // アステルの援護の絵（空・必殺技）
  G.assistRandom = false; G.assistFeather = false; G.assistRescue = false; G.rescued = false; G.blessing = false;
  if (G.assistImages) for (const u of [G.assistImages.sky, G.assistImages.skill]) { const pre = new Image(); pre.src = u; }
  G.skillSceneImage = args.skill_scene_image || null;   // 必殺技の絵
  if (G.skillSceneImage) { const pre = new Image(); pre.src = G.skillSceneImage; }
  G.meteorScene = args.meteor_scene || null;            // メテオを撃つときの絵と技名
  if (G.meteorScene) { const pre = new Image(); pre.src = G.meteorScene.image; }
  $("enemyName").textContent = `Lv.${c.enemy.lv} ${c.enemy.name}`;
  const weak = c.enemy.weak && c.magic ? c.magic.elements[c.enemy.weak] : null;   // 魔法の弱点だけ見せる（耐性は見せない）
  $("enemyWeak").textContent = weak ? `弱点：${weak.name}` : ""; $("enemyWeak").classList.toggle("on", !!weak);
  $("mpRow").style.display = c.ally.max_mp > 0 ? "" : "none";
  $("stageNo").textContent = c.extra ? "EXTRA" : `ステージ ${c.stage} / ${c.stage_count}`;
  $("quit").textContent = c.extra ? "にげる" : "やめる";
  $("allyName").textContent = c.ally.name.split("、").pop();
  if (args.ally_icon) $("allyIcon").src = args.ally_icon; else $("allyIcon").style.display = "none";
  $("allyIcon").classList.remove("down", "low");
  $("warn").classList.remove("on"); $("dark").classList.remove("on"); $("stun").classList.remove("on");
  $("btnEnd").classList.remove("on"); $("hint").textContent = "";
  prepareHitMask(args.hit_mask);
  initFoes(c, args);
  updateBars(); updateBadges();
  Streamlit.setHeight(Math.max(480, window.innerHeight));
  updateSkill();
  intro();
}

async function intro() {
  if (G.cfg.intro) await banner(G.cfg.stage === G.cfg.stage_count ? "最奥" : "", G.cfg.intro, 2600);
  if (G.cfg.extra) await banner("EXTRA STAGE", G.cfg.enemy.title ? `${G.cfg.enemy.title}が現れた！` : "", 1600);
  if (G.cfg.final) await banner("FINAL STAGE", `Lv.${G.cfg.enemy.lv} ${G.cfg.enemy.name}`, 1600);
  await banner("たたかえ！", "", 900);
  playerTurn();
}

// ---------------------------------------------------------------------------
// 当たり判定：敵の形をした白黒の「当たりマスク」（白い部分だけが当たり）
// ---------------------------------------------------------------------------
function prepareHitMask(uri) {
  if (!uri) return;
  const m = new Image();
  m.onload = () => {
    const cv = document.createElement("canvas"); cv.width = m.naturalWidth; cv.height = m.naturalHeight;
    const ctx = cv.getContext("2d", { willReadFrequently: true }); ctx.drawImage(m, 0, 0);
    const data = ctx.getImageData(0, 0, cv.width, cv.height).data;

    let sx = 0, sy = 0, n = 0;
    for (let y = 0; y < cv.height; y += 2) for (let x = 0; x < cv.width; x += 2) {
      if (data[(y * cv.width + x) * 4] > 127) { sx += x; sy += y; n++; }
    }
    G.hitMask = { w: cv.width, h: cv.height, data, cx: n ? sx / n / cv.width : 0.5, cy: n ? sy / n / cv.height : 0.5 };

}
function isOnEnemy(x, y, img, mask) {
  img = img || document.querySelector("#stage .st-target");
  if (!img) return false;
  if (mask === undefined) mask = G.hitMask;
  const r = img.getBoundingClientRect(), nw = img.naturalWidth, nh = img.naturalHeight;
  if (!nw || !mask) return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  const cs = getComputedStyle(img);
  const cover = cs.objectFit === "cover";
  const s = cover ? Math.max(r.width / nw, r.height / nh) : Math.min(r.width / nw, r.height / nh);
  const dw = nw * s, dh = nh * s;
  // object-position（例 "64% 50%"）。敵だけの画像は下寄せ、それ以外は指定どおり
  const pos = cs.objectPosition.split(" ").map((v) => v.endsWith("%") ? parseFloat(v) / 100 : 0.5);
  const fy = img.classList.contains("st-enemy") ? 1 : pos[1];
  const ox = r.left + (r.width - dw) * pos[0];
  const oy = r.top + (r.height - dh) * fy;
  let u = (x - ox) / dw, v = (y - oy) / dh;
  const m = mask;
  if (G.status.darkness > 0) {           // 陰：重心を中心に、当たる範囲を縦横 hit_scale 倍に縮める
    const k = G.cfg.status.darkness.hit_scale;
    u = m.cx + (u - m.cx) / k; v = m.cy + (v - m.cy) / k;
  }
  if (u < 0 || u >= 1 || v < 0 || v >= 1) return false;
  const px = Math.floor(u * m.w), py = Math.floor(v * m.h);
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const xx = px + dx, yy = py + dy;
    if (xx >= 0 && yy >= 0 && xx < m.w && yy < m.h && m.data[(yy * m.w + xx) * 4] > 127) return true;

}

let perTapMult = 1;
async function attack() {
  if (G.multi) return attackMulti();
  G.phase = "ready"; setButtons(false); $("sheet").classList.remove("open"); $("gearSheet").classList.remove("open");
  await banner("よーい……", G.status.freeze > 0 ? "❄️ 凍えて 連打の時間が短い！" : "", 700);
  await banner("スタート！", "", 450);
  // 連打の受付
  G.phase = "tapping"; G.tapHits = 0; G.tapDamage = 0;
  const a = G.cfg.ally, broken = G.eBreak > 0;          // 概念崩し：敵の防御0
  const perTap = G.atkTurns > 0 ? (broken ? a.tap_damage_up_break : a.tap_damage_up) : (broken ? a.tap_damage_break : a.tap_damage);
  $("tapzone").classList.add("on"); $("gearBtn").style.visibility = "hidden"; $("app").classList.add("tapping"); $("tip").style.display = "none"; $("timer").style.display = "block"; $("combo").style.display = "block";
  $("combo").querySelector(".c").textContent = "0"; $("combo").querySelector(".d").textContent = "";
  const t0 = performance.now(), dur = attackMs();
  const critRate = currentCrit(), critMult = (G.cfg.magic || {}).crit_mult || 2;
  if (G.braveTurns > 0) perTapMult = G.braveMult; else perTapMult = 1;
  $("tapzone").onpointerdown = (ev) => {
    ev.preventDefault();
    if (G.phase !== "tapping") return;
    G.taps++;
    const hit = isOnEnemy(ev.clientX, ev.clientY);
    const sp = document.createElement("div"); sp.className = "spark" + (hit ? "" : " miss");
    sp.style.left = ev.clientX + "px"; sp.style.top = ev.clientY + "px"; $("app").appendChild(sp); setTimeout(() => sp.remove(), 380);
    if (!hit) { G.misses++; return; }                   // 敵以外はノーヒット
    G.hits++; G.tapHits++;
    const crit = Math.random() < critRate;                 // 会心：その1回が2倍（防御は効いたまま）
    G.tapDamage += perTap * perTapMult * (crit ? critMult : 1);
    if (crit) { G.crits++; sp.classList.add("crit"); popAt(ev.clientX, ev.clientY - 30, "会心！", "proc crit-pop"); }
    if (G.cfg.skill) { G.charge = Math.min(G.cfg.skill.charge, G.charge + 1); updateSkill(); }   // 当たった回数でチャージ
    $("combo").querySelector(".c").textContent = G.tapHits;
    $("combo").querySelector(".d").textContent = fmt(G.tapDamage) + " ダメージ";
    const img = curTarget();

    if (navigator.vibrate) navigator.vibrate(8);
  };

      const p = Math.min(1, (performance.now() - t0) / dur);
      $("timer").firstElementChild.style.width = (1 - p) * 100 + "%";
      if (p < 1) requestAnimationFrame(tick); else resolve();
    };

  // 合計ダメージで一気に攻撃

  if (boost > 1) G.tapDamage *= boost;
  const total = Math.min(G.tapDamage, G.enemyHp);
  await sleep(150);
  $("combo").style.display = "none";
  const evaded = G.tapHits > 0 && G.status.shadow > 0 && Math.random() < G.cfg.status.shadow.evade_rate;
  if (G.tapHits === 0) {
    await banner("ミス！", "敵に当たらなかった", 900);

  } else {

    await sleep(240);
    const img = curTarget(); img.classList.remove("struck"); void img.offsetWidth; img.classList.add("struck");
    shake();

  if (G.status.freeze > 0) G.status.freeze--;
  if (G.critTurns > 0) G.critTurns--;
  if (G.hasteItemTurns > 0) G.hasteItemTurns--;
  if (G.hasteSpellTurns > 0) G.hasteSpellTurns--;

// アステルの必殺技：暗転 → 星が集まって魔法陣 → 一枚絵 → 技名 → 光の咆哮 → 真っ白
async function grandSkill(s, src, who) {

  if (navigator.vibrate) navigator.vibrate([60, 60, 60, 60, 120]);
  // 1. 星が中心に集まり、金の魔法陣が描かれる
  for (let i = 0; i < 46; i++) {
    const st = document.createElement("div"); st.className = "g-star";

    sp.style.setProperty("--dx", (Math.random() * 80 - 40) + "px"); sp.style.setProperty("--dy", (-30 - Math.random() * 60) + "px");
    sp.style.setProperty("--d", (0.8 + Math.random() * 0.8) + "s"); fx.appendChild(sp); setTimeout(() => sp.remove(), 1700);

// アステルの援護：空を見上げる → アステルが飛んでくる → 必殺技 → 大ダメージ。勝てば true
// 倒れそうなとき（HPが0になった）："won"（援護で勝った）/ "saved"（助かった）/ "" （負け）
async function saveFromDown() {
  const as = G.cfg.assist;
  if (!as || G.phase === "end") return "";
  // はじめての人：最初に倒れそうになったとき、アステルが必ず助けに来る（HP1で踏みとどまる）
  if (as.rescue && !G.rescued) {
    G.rescued = true; G.allyHp = 1; updateBars();
    $("allyIcon").classList.remove("down");
    return (await astelAssist("rescue")) ? "won" : "saved";
  }
  // 立ち上がれるアイテム（精霊の羽・不死鳥の羽・いのちの葉）を持っていれば、使うか聞く
  const choices = G.cfg.items.filter((i) => (i.assist || i.revive > 0) && G.bag[i.id] > 0);
  if (!choices.length) return "";
  const first = choices[0];
  $("revive").querySelector(".ricon").src = G.icons[first.id] || "";
  $("reviveSub").textContent = choices.length > 1 ? "どれを使うかえらんでね" : (first.assist ? "HP・MP全回復・状態異常を全部治す・精霊の加護、そしてアステルが援護に来る" : first.text || "");
  $("reviveAsk").textContent = choices.length > 1 ? "アイテムを使いますか？" : `${first.name}を使いますか？`;
  const listEl = $("reviveList"); listEl.innerHTML = "";
  const chosen = await new Promise((res) => {
    for (const it of choices) {
      const b = document.createElement("button"); b.type = "button"; b.className = "btn attack";
      b.textContent = `${it.name}を使う（のこり${G.bag[it.id]}）`;
      b.onclick = () => res(it);
      listEl.appendChild(b);
    }
    $("reviveNo").onclick = () => res(null);
    $("revive").classList.add("on");
  });
  $("revive").classList.remove("on");
  if (!chosen) return "";
  G.bag[chosen.id]--; G.used[chosen.id] = (G.used[chosen.id] || 0) + 1;
  if (!chosen.assist) {                                   // いのちの葉・不死鳥の羽：その割合のHPで立ち上がる（状態異常も消える）
    G.allyHp = G.cfg.ally.max_hp * chosen.revive;
    for (const id of Object.keys(G.status)) G.status[id] = 0;
    $("allyIcon").classList.remove("down");
    const ic = $("allyIcon").getBoundingClientRect();
    fxEl("flash", { background: "rgba(255,200,120,.45)" }); particles("#ffd9a0", 24, 50);
    popAt(ic.left + ic.width / 2 + 60, ic.top, chosen.revive >= 1 ? "全回復！" : "立ち上がった！", "heal");
    updateBars(); updateBadges();
    await sleep(900);
    return "saved";
  }
  const feather = chosen;
  {
    G.allyHp = G.cfg.ally.max_hp;                         // 全回復
    if (feather.mp > 0) G.mp = G.cfg.ally.max_mp;
    for (const id of feather.cure || []) G.status[id] = 0;
    G.blessing = true;
    G.cfg.ally.immune = [...new Set([...(G.cfg.ally.immune || []), ...(as.immune || [])])];
    $("allyIcon").classList.remove("down");
    const ic = $("allyIcon").getBoundingClientRect();
    popAt(ic.left + ic.width / 2 + 60, ic.top, "全回復！", "heal"); fxEl("flash", { background: "rgba(255,250,220,.5)" });
    updateBars(); updateBadges();
    await sleep(600);
    return (await astelAssist("feather")) ? "won" : "saved";
  }
  return "";
}

async function astelAssist(kind) {
  const as = G.cfg.assist, im = G.assistImages || {};
  if (!as) return false;
  if (kind === "random" || kind === "rescue") G.assistRandom = true; else G.assistFeather = true;
  if (kind === "rescue") G.assistRescue = true;
  G.phase = "assist"; setButtons(false); $("sheet").classList.remove("open"); $("gearSheet").classList.remove("open");
  // 1. 空を見上げる
  await banner(kind === "rescue" ? "……もう、だめか……" : kind === "random" ? "……空が、光った？" : "精霊の羽が、空へ舞い上がった……", "", 1300);
  if (kind === "rescue") await banner("……空が、光った？", "", 1100);
  $("stage").classList.add("lookup"); $("fx").classList.add("lookup");
  await sleep(900);
  // 2. アステルが空を翔ける
  const sky = $("sky");
  if (im.sky) sky.querySelector("img").src = im.sky;
  // この世界ではアステルは知られていないので、名前は本人のせりふで初めて出す
  sky.querySelector(".narr").textContent = kind === "feather" ? "……また、あの光が……" : "……龍？　……女神？";
  sky.querySelector(".who").textContent = as.speaker || "アステル";
  sky.querySelector(".say").textContent = kind === "feather" ? "呼んでくれたのね。あとは、わたしに任せて" : "大丈夫？　あとは、わたしに任せて";
  sky.classList.remove("on"); void sky.offsetWidth; sky.classList.add("on");
  if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
  await sleep(4400);
  sky.classList.remove("on");
  $("stage").classList.remove("lookup"); $("fx").classList.remove("lookup");
  // 3. 必殺技（アステルの特別演出）
  await grandSkill({ name: as.name, scene: as.scene || {} }, im.skill || G.skillSceneImage, as.speaker || "アステル");
  await SKILL_FX.astel.fx();
  await sleep(250);
  // 4. ダメージと、敵の防御崩壊
  const c = enemyCenter();
  const dmg = G.eBreak > 0 ? as.damage_break : as.damage, hit = Math.min(dmg, G.enemyHp);
  const img = curTarget(); img.classList.remove("struck"); void img.offsetWidth; img.classList.add("struck");
  shake(); popAt(c.x, c.y, fmt(dmg), "big");
  hitEnemy(hit); updateBars();
  if (as.break_turns) { G.eBreak = Math.max(G.eBreak, as.break_turns); popAt(c.x, c.y + 70, "💥 防御崩壊！", "proc"); }
  popAt(window.innerWidth / 2, window.innerHeight * 0.3, `✨ ${as.speaker || "アステル"}の援護！`, "info");
  updateBadges();
  await sleep(1100);
  if (foesDown()) { finish("win"); return true; }
  return false;
}
async function useSkill() {
  const s = G.cfg.skill, look = SKILL_FX[s.anim] || SKILL_FX.kou;
  G.phase = "skill"; G.skillUsed = true; G.charge = 0;
  setButtons(false); updateSkill(); $("sheet").classList.remove("open");
  if (s.scene && s.scene.grand && G.skillSceneImage) {
    await grandSkill(s, G.skillSceneImage);       // アステル：特別演出
    await look.fx();
  } else if (s.scene && G.skillSceneImage) {
    await specialScene(s.name, G.skillSceneImage, s.scene.focus || "50% 45%", look.color);   // 絵のある必殺技
    await look.fx();
  } else {
    await cutin(s.name, look.color);
    await look.fx();
  }
  await sleep(250);
  const c = enemyCenter(), me = $("allyIcon").getBoundingClientRect();
  if (s.type === "strike") {
    const dmg = G.eBreak > 0 ? s.damage_break : s.damage, hit = Math.min(dmg, G.enemyHp);
    const img = curTarget(); img.classList.remove("struck"); void img.offsetWidth; img.classList.add("struck");
    shake(); popAt(c.x, c.y, fmt(dmg), "big");
    hitEnemy(hit); updateBars();
    if (s.guard) G.guardTurns = Math.max(G.guardTurns, s.guard);
    if (s.stun) { G.eStatus.thunder = Math.max(G.eStatus.thunder, s.stun); popAt(c.x, c.y + 70, "⚡ 動けない！", "proc"); }
    if (s.break_turns) { G.eBreak = Math.max(G.eBreak, s.break_turns); popAt(c.x, c.y + 70, "💥 防御崩壊！", "proc"); }
  } else if (s.type === "guard") {
    const before = G.allyHp;
    G.allyHp = Math.min(G.cfg.ally.max_hp, G.allyHp + s.heal);
    popAt(me.left + me.width / 2 + 60, me.top, "+" + fmt(G.allyHp - before), "heal");
    G.guardTurns = Math.max(G.guardTurns, s.guard);
  } else if (s.type === "boost") {
    G.boost = s.mult;
  } else if (s.type === "barrier") {
    G.barrier = s.blocks;
    for (const id of ["poison", "fire", "black_flame", "thunder"]) G.status[id] = 0;
  } else if (s.type === "break") {
    G.eBreak = s.turns;
  }
  updateBars(); updateBadges();
  await sleep(900);
  if (foesDown()) return finish("win");
  G.phase = "player"; setButtons(true); updateSkill();
}

function esc(t) { return String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function statusImg(id) { const u = G.statusIcons[id]; return u ? `<img src="${u}" alt="">` : ""; }
function openGear() {
  // 付けている装備のアイコンだけを並べ、押した装備のくわしい中身を下に出す
  const L = G.cfg.loadout || { gear: [], acc: [] };
  const all = [...(L.gear || []), ...(L.acc || [])];
  const icon = (e, n) => {
    const attrs = [...new Set((e.attrs || []).flatMap((a) => a.ids))].map(statusImg).join("");
    return `<button type="button" class="gicon" data-n="${n}">${G.equipIcons[e.id] ? `<img src="${G.equipIcons[e.id]}" alt="">` : ""}` +
           (attrs ? `<span class="ga">${attrs}</span>` : "") + `</button>`;
  };
  const row = (arr, start, empty) => arr.length ? `<div class="grow">${arr.map((e, k) => icon(e, start + k)).join("")}</div>` : `<div class="gempty">${empty}</div>`;
  $("gearList").innerHTML =
    `<div class="gsec">装備品</div>${row(L.gear || [], 0, "付けていません")}` +
    `<div class="gsec">アクセサリ</div>${row(L.acc || [], (L.gear || []).length, "付けていません")}` +
    `<div id="gearInfo" class="ginfo">${all.length ? "装備を押すと、くわしく見られるよ" : ""}</div>`;
  $("gearList").querySelectorAll(".gicon").forEach((b) => {
    b.onclick = () => {
      $("gearList").querySelectorAll(".gicon").forEach((x) => x.classList.toggle("on", x === b));
      const e = all[+b.dataset.n];
      const attrs = (e.attrs || []).map((a) => `<div class="gattr">${a.ids.map(statusImg).join("")}<span>${esc(a.text)}</span></div>`).join("");
      $("gearInfo").innerHTML = `<div class="gitem">${G.equipIcons[e.id] ? `<img src="${G.equipIcons[e.id]}" alt="">` : ""}` +
        `<div><b>${esc(e.name)}</b><span class="rk">${esc(e.rank)}</span><div class="ef">${esc(e.effect)}</div>${attrs}</div></div>`;
    };
  });
  $("sheet").classList.remove("open");
  $("gearSheet").classList.add("open");
}

$("gearClose").onclick = () => $("gearSheet").classList.remove("open");

// 魔法（式は story_logic.py / story_data.py と同じ。魔力の水で魔力が変わるので、ここで計算する）
//   魔力係数 = 2×魔力÷(魔力+10)   消費MP = 基本×(1−0.2×係数) の切り上げ   満点の回数 = 120×(1−0.35×係数)
//   攻撃 = 魔力 × 威力 × 詠唱率 × 属性 × 会心（敵の防御は半分だけ効く）  回復・強化 = 基本 × 係数 × 詠唱率

function curMag() { return (G.cfg.ally.mag || 0) * (G.magTurns > 0 ? G.magMult : 1); }

  return Math.max(1, Math.ceil(sp.mp * cut - 1e-9));

  return "";
}

    (G.cfg.enemy.weak ? `弱点の${G.cfg.magic.elements[G.cfg.enemy.weak].name}は1.5倍！` : "") + " 魔法を使うと、このターンは攻撃できないよ。";

async function resolveSpell(sp, rate) {

  const critChance = currentCrit() * M.magic_crit_rate;
  const crit = (sp.kind === "attack" || sp.kind === "heal" || sp.kind === "mana") && Math.random() < critChance;
  const cm = crit ? M.magic_crit_mult : 1;
  if (crit) { G.crits++; await banner("会心！", `${sp.name}の効果 ×${M.magic_crit_mult}`, 650, "win"); }
  if (sp.kind === "attack" && G.multi && sp.target === "enemies") {      // 敵全体：生きている敵みんなに
    const keep = G.cur;
    for (const i of aliveFoes()) { foeLoad(i); await spellHit(sp, rate, cm, el, M, i === aliveFoes()[0]); }
    foeLoad(G.foes[keep].dead ? (aliveFoes()[0] ?? keep) : keep);

    await spellHit(sp, rate, cm, el, M, true);

    const c = enemyCenter(); popAt(c.x, c.y, fmt(dmg), "big");
    if (elemMult > 1) popAt(c.x, c.y + 80, `${el.icon} 弱点！`, "proc");
    else if (elemMult < 1) popAt(c.x, c.y + 80, "いまひとつ…", "proc");

    fxEl("flash", { background: "rgba(120,255,170,.28)" }); fxEl("ring", { "--c": "#7dffae", "--s": 30 });
    popAt(mx, me.top, "+" + fmt(G.allyHp - before), "heal");
    if (G.mp > mpBefore) setTimeout(() => popAt(mx, me.top - 40, `MP +${fmt(G.mp - mpBefore)}`, "proc"), 300);
  } else if (sp.kind === "cure") {
    for (const id of Object.keys(G.status)) G.status[id] = 0;
    fxEl("flash", { background: "rgba(200,255,220,.35)" });
    popAt(mx, me.top, "状態異常が治った！", "heal");
  } else if (sp.kind === "protect") {
    const turns = Math.max(1, Math.round(sp.turns * (0.5 + 0.5 * k) * rate));

    popAt(mx, me.top, `防御2倍（${turns}ターン）`, "heal");

    popAt(mx, me.top, `連打 +${sp.seconds}秒（${G.hasteSpellTurns}回）`, "info");
  }

// 風哭きの森：敵が何体も（G.multi）。いま狙っている敵（G.cur）の数字を G.enemyHp・G.cfg.enemy などに入れて動かし、
// ほかの敵の数字は G.foes[i] にしまっておく（foeLoad で入れかえる）
// ---------------------------------------------------------------------------
function loadMask(uri) {
  return new Promise((res) => {
    if (!uri) return res(null);
    const m = new Image();
    m.onload = () => {
      const cv = document.createElement("canvas"); cv.width = m.naturalWidth; cv.height = m.naturalHeight;
      const ctx = cv.getContext("2d", { willReadFrequently: true }); ctx.drawImage(m, 0, 0);
      const data = ctx.getImageData(0, 0, cv.width, cv.height).data;
      let sx = 0, sy = 0, n = 0;
      for (let y = 0; y < cv.height; y += 2) for (let x = 0; x < cv.width; x += 2) if (data[(y * cv.width + x) * 4] > 127) { sx += x; sy += y; n++; }
      res({ w: cv.width, h: cv.height, data, cx: n ? sx / n / cv.width : 0.5, cy: n ? sy / n / cv.height : 0.5 });
    };
    m.onerror = () => res(null);
    m.src = uri;
  });
}
function initFoes(c, args) {

  G.foes.forEach((f, i) => {
    if (G.foes.length < 2) return;
    const bar = document.createElement("div"); bar.className = "foebar"; bar.innerHTML = "<div></div>"; bar.dataset.idx = i; $("app").appendChild(bar);
    const tag = document.createElement("div"); tag.className = "foetag"; tag.dataset.idx = i; tag.textContent = f.cfg.name; $("app").appendChild(tag);
  });

  setTimeout(layoutFoeBars, 300);

function foesDown() {

// 攻撃魔法1回ぶん（いま G.cur にいる敵へ）
async function spellHit(sp, rate, cm, el, M, fx) {
  const e = G.cfg.enemy;
  const elemMult = sp.element !== "none" && sp.element === e.weak ? M.weak : sp.element !== "none" && sp.element === e.resist_elem ? M.resist : 1;
  const raw = curMag() * sp.power * (sp.target === "enemies" ? M.all_rate : 1) * rate * cm * elemMult;
  const def = G.eBreak > 0 ? 0 : e.def * M.def_rate;
  const dmg = raw * (1 - def / (def + M.defense_k));
  if (fx) {
    const kind = { fire: "fire", thunder: "thunder", ice: "magic", light: "radiance", dark: "void", none: "magic" }[sp.element] || "magic";
    (EFFECTS[kind] || EFFECTS.magic)(el.color);
    if (sp.target === "enemies" || sp.power >= 130) setTimeout(() => { fxEl("ring", { "--c": el.color, "--s": 60 }); particles(el.color, 20, 60); }, 250);
    await sleep(420);
    shake();
    if (navigator.vibrate) navigator.vibrate([30, 40, 60]);
  }
  const img = curTarget(); img.classList.remove("struck"); void img.offsetWidth; img.classList.add("struck");
  const c = enemyCenter(); popAt(c.x, c.y, fmt(dmg), "big");
  if (elemMult > 1) popAt(c.x, c.y + 80, `${el.icon} 弱点！`, "proc");
  else if (elemMult < 1) popAt(c.x, c.y + 80, "いまひとつ…", "proc");
  hitEnemy(dmg); foeSave(); updateBars();
  await sleep(G.multi ? 250 : 0);
}

// 敵のターン（何体も）：敵の持続ダメージ → 覚醒 → 自分の持続ダメージ → 1体ずつ行動
async function enemyTurnMulti() {
  if (G.phase === "end") return;
  G.phase = "enemy";
  const r = $("allyIcon").getBoundingClientRect(), bub = $("bubble");
  const keep = G.sel;
  // 0. 剣の毒・火・黒炎（敵ごと）
  for (const i of aliveFoes()) {
    foeLoad(i);
    let edot = 0;
    for (const id of Object.keys(G.eDots)) { edot += G.eDots[id].shift(); if (!G.eDots[id].length) delete G.eDots[id]; }
    if (edot > 0) {
      const c = enemyCenter();
      const img = curTarget(); img.classList.remove("struck"); void img.offsetWidth; img.classList.add("struck");
      popAt(c.x, c.y, "-" + fmt(edot), "edot");
      hitEnemy(Math.min(edot, G.enemyHp)); foeSave(); updateBars(); updateBadges();
      await sleep(650);
    }
  }
  fxEl("vignette", { "--c": "rgba(150,60,220,.25)" });
  if (foesDown()) return finish("win");
  // 覚醒（ボス・エクストラ。1体のとき）
  if (G.foes.length === 1) {
    foeLoad(0);
    if (G.cfg.awaken && !G.awakened && G.enemyHp <= G.cfg.enemy.max_hp * G.cfg.awaken.hp_rate) await awaken();
  }
  // 1. 自分の持続ダメージ
  let dot = 0;
  for (const id of DOTS) {
    if (!(G.status[id] > 0)) continue;
    const st = G.cfg.status[id];
    dot += G.guardTurns > 0 ? st.damage_guard : st.damage;
    G.status[id]--;
  }
  if (dot > 0) {
    fxEl("vignette", { "--c": "rgba(150,60,220,.55)" });
    hurt(dot, r.left + r.width / 2 + 70, r.top - 10, "dot");
    updateBadges();
    await sleep(800);
    if (G.allyHp <= 1e-9) { const res = await saveFromDown(); if (res === "won") return; if (res === "saved") { foeLoad(G.sel); await sleep(G.cfg.pause_ms); return playerTurn(); } return finish("lose"); }
  }
  if (G.status.thunder > 0) G.status.thunder--;
  // 2. 1体ずつ行動
  for (const i of aliveFoes()) {
    if (G.phase === "end") return;
    foeLoad(i);
    const e = G.cfg.enemy, f = G.foes[i];
    if (G.eStatus.thunder > 0) {
      G.eStatus.thunder--;
      const c = enemyCenter(); EFFECTS.thunder("#ffe96a"); popAt(c.x, c.y, "⚡ しびれて動けない！", "proc");
      if (G.eBreak > 0) G.eBreak--;
      foeSave(); updateBadges(); await sleep(1000); continue;
    }
    if (e.heal) {                                  // 回復役：減っている仲間（自分もふくむ）を回復
      foeSave();
      const hurtIdx = aliveFoes().filter((j) => G.foes[j].hp < G.foes[j].cfg.max_hp * 0.75)
        .sort((a, b) => G.foes[a].hp / G.foes[a].cfg.max_hp - G.foes[b].hp / G.foes[b].cfg.max_hp)[0];
      if (hurtIdx != null && Math.random() < 0.7) {
        bub.style.setProperty("--bubble", "#6dff9a"); bub.textContent = e.lines[0]; bub.style.display = "block";
        await sleep(900); bub.style.display = "none";
        foeLoad(hurtIdx);
        const heal = G.cfg.enemy.max_hp * e.heal;
        G.enemyHp = Math.min(G.cfg.enemy.max_hp, G.enemyHp + heal); foeSave();
        const c = enemyCenter(); popAt(c.x, c.y, "+" + fmt(heal), "heal"); fxEl("ring", { "--c": "#6dff9a", "--s": 30 });
        updateBars(); await sleep(800);
        foeLoad(i); if (G.eBreak > 0) G.eBreak--; foeSave();
        continue;
      }
    }
    const times = e.double ? 2 : 1;
    for (let k = 0; k < times; k++) {
      const res = await foeAttack(i);
      if (res === "won" || res === "lose") return;
      if (res === "saved") { foeLoad(G.sel); await sleep(G.cfg.pause_ms); return playerTurn(); }
      if (G.phase === "end") return;
    }
    if (G.eBreak > 0) G.eBreak--;
    foeSave();
  }
  if (G.guardTurns > 0) G.guardTurns--;
  if (G.ward > 0) G.ward--;
  foeLoad(G.foes[keep] && !G.foes[keep].dead ? keep : G.sel);
  markSel(); updateBars(); updateBadges();
  const as = G.cfg.assist;
  if (as && as.random && !G.assistRandom && G.assistImages && Math.random() < as.chance) {
    if (await astelAssist("random")) return;
  }
  await sleep(G.cfg.pause_ms);
  playerTurn();
}

// 敵1体の攻撃1回。"won"（援護で勝った）/ "lose" / "saved"（倒れそうになって立ち上がった）/ ""
async function foeAttack(i) {
  const e = G.cfg.enemy, f = G.foes[i], bub = $("bubble"), r = $("allyIcon").getBoundingClientRect();
  const sp = G.awakened && G.cfg.awaken && G.cfg.awaken.special;

  G.specialNext = false;
  // 力をためる（heavy）：3回に1回は予告だけ。次の攻撃が重い一撃
  let heavyNow = false;
  if (e.heavy && !special && !G.meteorPending) {
    if (f.charging) { heavyNow = true; f.charging = false; }
    else if ((f.attacks + 1) % (G.cfg.heavy_every || 3) === 0) {

  }
  const preStatus = !special && !G.meteorPending && !heavyNow && e.gimmicks.length && Math.random() < G.cfg.status_chance ? pick(e.gimmicks) : null;
  const espell = preStatus && G.cfg.enemy_spells ? G.cfg.enemy_spells[preStatus] : null;

  bub.textContent = special ? sp.line : G.meteorPending ? "……星よ、堕ちよ" : heavyNow ? "はあぁぁっ！！" : espell ? `「${espell.name}」！` : pick(e.lines);
  bub.style.display = "block";
  if (espell) { fxEl("ring", { "--c": espell.color, "--s": 40 }); particles(espell.color, 12, 40); }
  const fc = enemyCenter(); fxEl("ring", { "--c": e.effect.color, "--s": 18, left: fc.x + "px" });
  await sleep(900);
  f.attacks++; G.enemyAttacks++;
  let newStatus = null;
  const mult = G.eStatus.darkness > 0 ? G.eStatus.darkMult : 1;
  if (G.eStatus.darkness > 0) G.eStatus.darkness--;
  const dodged = G.eStatus.shadow > 0 && Math.random() < G.cfg.enemy_status.shadow.evade_rate;
  if (G.eStatus.shadow > 0) G.eStatus.shadow--;
  if (G.meteorPending && G.meteorScene) { bub.style.display = "none"; await specialScene(G.meteorScene.name, G.meteorScene.image, G.meteorScene.focus); }
  if (G.barrier > 0 && !dodged) {

    (EFFECTS[e.effect.type] || EFFECTS.slash)(e.effect.color); await sleep(380);
    fxEl("circle", { "--c": "#7fc8ff" }); popAt(r.left + r.width / 2 + 70, r.top - 10, "🔰 障壁で防いだ！", "heal");
  } else if (dodged) {
    if (G.meteorPending) { G.meteorPending = false; G.meteorUsed = true; $("warn").classList.remove("on"); }
    (EFFECTS[e.effect.type] || EFFECTS.slash)(e.effect.color); await sleep(380);
    popAt(r.left + r.width / 2 + 70, r.top - 10, "👤 よけた！", "heal");
  } else if (G.meteorPending) {
    G.meteorPending = false; G.meteorUsed = true; $("warn").classList.remove("on");
    EFFECTS.cosmic("#ff9a3a"); fxEl("vignette", { "--c": "rgba(255,90,0,.7)" }); await sleep(380); shake();
    hurt(G.allyHp * G.cfg.meteor.current_hp_rate * mult, r.left + r.width / 2 + 70, r.top - 10);
    if (!(G.ward > 0)) G.status.black_flame = G.cfg.status.black_flame.turns;

// 敵のターン：持続ダメージ → 雷を1減らす → 敵の攻撃（メテオ） → 新しい状態異常の抽選 → 防御アップを1減らす
// ---------------------------------------------------------------------------
const DOTS = ["poison", "fire", "black_flame"];   // 敵のターンのはじめにダメージを受ける状態異常

function hurt(amount, x, y, cls) {
  const dmg = Math.min(amount, G.allyHp);
  G.allyHp -= dmg; G.taken += dmg;
  const ic = $("allyIcon"); ic.classList.remove("hurt"); void ic.offsetWidth; ic.classList.add("hurt");
  popAt(x, y, "-" + fmt(amount), cls || "hurt");
  updateBars();
}

// 剣の属性：攻撃が当たったら、剣1本ごとに発動の抽選。base はその攻撃の合計ダメージ
async function procWeapons(base) {
  const hits = [];
  for (const w of G.cfg.weapons || []) {
    if (w.group.length && Math.random() < w.group_chance) hits.push(pick(w.group));   // 毒・火・雷から1つ
    for (const [id, chance] of Object.entries(w.solo)) if (Math.random() < chance) hits.push(id);   // 黒炎・陰・影は別々
  }
  const seen = new Set();
  for (const id of hits) {
    if (seen.has(id)) continue;                    // 同じ攻撃で同じ属性が2回出ても1回分
    seen.add(id);
    const st = G.cfg.enemy_status[id], c = enemyCenter();
    if (id === "thunder" && st.immune) {
      popAt(c.x, c.y + 70, "⚡ 天変地異の力で 雷が効かない！", "proc");
      await sleep(650); continue;
    }
    if (st.dot) {                                  // 同じ属性がまたかかったら、今回のダメージで最初から
      const list = [];
      for (const [rate, turns] of st.dot) for (let i = 0; i < turns; i++) list.push(base * rate);
      G.eDots[id] = list;
    } else if (id === "thunder") {
      G.eStatus.thunder = st.turns_min + Math.floor(Math.random() * (st.turns_max - st.turns_min + 1));
    } else if (id === "darkness") {
      G.eStatus.darkness = st.turns;
      G.eStatus.darkMult = st.damage_min + Math.random() * (st.damage_max - st.damage_min);
    } else if (id === "shadow") {
      G.eStatus.shadow = st.turns;
    }
    popAt(c.x, c.y + 70, `${st.icon} ${st.name}！`, "proc");
    updateBadges();
    await sleep(650);
  }
}

async function enemyTurn() {

  const e = G.cfg.enemy, bub = $("bubble"), r = $("allyIcon").getBoundingClientRect();

    if (!(G.status[id] > 0)) continue;
    const st = G.cfg.status[id];
    dot += G.guardTurns > 0 ? st.damage_guard : st.damage;
    G.status[id]--;
  }
  if (dot > 0) {
    fxEl("vignette", { "--c": "rgba(150,60,220,.55)" });
    hurt(dot, r.left + r.width / 2 + 70, r.top - 10, "dot");
    updateBadges();
    await sleep(800);
    if (G.allyHp <= 1e-9) { const r = await saveFromDown(); if (r === "won") return; if (r === "saved") { await sleep(G.cfg.pause_ms); return playerTurn(); } return finish("lose"); }
  }
  if (G.status.thunder > 0) G.status.thunder--;     // 雷は敵のターンごとに減る

  // 剣の雷：敵が動けない
  if (G.eStatus.thunder > 0) {
    G.eStatus.thunder--;
    const c = enemyCenter();
    EFFECTS.thunder("#ffe96a");
    popAt(c.x, c.y, "⚡ しびれて動けない！", "proc");
    if (G.guardTurns > 0) G.guardTurns--;
    if (G.eBreak > 0) G.eBreak--;
    if (G.ward > 0) G.ward--;
    updateBadges();
    await sleep(1300);
    await sleep(G.cfg.pause_ms);
    return playerTurn();
  }

  // 2. 敵の攻撃（予告が出ていればメテオに変わる）
  // 覚醒した宇宙龍の大技：覚醒して最初の攻撃と、そのあとは決まった確率で
  const special = !!(G.awakened && !G.meteorPending && (G.specialNext || Math.random() < G.cfg.awaken.special.chance));
  G.specialNext = false;
  // ふつうの攻撃なら、ここで状態異常の抽選をしておく。炎・雷・黒炎・凍えは「魔法」として名前を出す
  const preStatus = !special && !G.meteorPending && e.gimmicks.length && Math.random() < G.cfg.status_chance ? pick(e.gimmicks) : null;
  const espell = preStatus && G.cfg.enemy_spells ? G.cfg.enemy_spells[preStatus] : null;
  bub.style.setProperty("--bubble", espell ? espell.color : e.effect.color);
  bub.textContent = special ? G.cfg.awaken.special.line : G.meteorPending ? "……星よ、堕ちよ" : espell ? `「${espell.name}」！` : pick(e.lines); bub.style.display = "block";
  if (espell) { fxEl("ring", { "--c": espell.color, "--s": 40 }); particles(espell.color, 12, 40); }
  await sleep(1100);
  G.enemyAttacks++;
  let newStatus = null;
  // 剣の陰：次の1回の攻撃が弱まる。剣の影：30%でよける
  const mult = G.eStatus.darkness > 0 ? G.eStatus.darkMult : 1;
  if (G.eStatus.darkness > 0) G.eStatus.darkness--;
  const dodged = G.eStatus.shadow > 0 && Math.random() < G.cfg.enemy_status.shadow.evade_rate;
  if (G.eStatus.shadow > 0) G.eStatus.shadow--;
  if (G.meteorPending && G.meteorScene) {                  // メテオ：撃つ前に、画面いっぱいの絵と技名
    bub.style.display = "none";
    await specialScene(G.meteorScene.name, G.meteorScene.image, G.meteorScene.focus);
  }
  if (G.barrier > 0 && !dodged) {                          // 魔法障壁：攻撃を無効にする
    G.barrier--;
    if (G.meteorPending) { G.meteorPending = false; G.meteorUsed = true; $("warn").classList.remove("on"); }
    (EFFECTS[e.effect.type] || EFFECTS.slash)(e.effect.color);
    await sleep(380);
    fxEl("circle", { "--c": "#7fc8ff" });
    popAt(r.left + r.width / 2 + 70, r.top - 10, "🔰 障壁で防いだ！", "heal");
  } else if (dodged) {
    if (G.meteorPending) { G.meteorPending = false; G.meteorUsed = true; $("warn").classList.remove("on"); }
    (EFFECTS[e.effect.type] || EFFECTS.slash)(e.effect.color);
    await sleep(380);
    popAt(r.left + r.width / 2 + 70, r.top - 10, "👤 よけた！", "heal");
  } else if (G.meteorPending) {
    G.meteorPending = false; G.meteorUsed = true; $("warn").classList.remove("on");
    EFFECTS.cosmic("#ff9a3a"); fxEl("vignette", { "--c": "rgba(255,90,0,.7)" });
    await sleep(380);
    shake();
    hurt(G.allyHp * G.cfg.meteor.current_hp_rate * mult, r.left + r.width / 2 + 70, r.top - 10);
    if (!(G.ward > 0)) G.status.black_flame = G.cfg.status.black_flame.turns;    // メテオのあとは黒炎（封炎中はかからない）
    newStatus = "black_flame";
  } else if (special) {
    bub.style.display = "none";
    const sp = G.cfg.awaken.special;
    await specialScene(sp.name, G.awakenArgs && G.awakenArgs.special, "35% 50%");
    // 術式解除：アイテムでかけた守り（封炎・防御アップ）を消す
    if (G.ward > 0 || G.guardTurns > 0) {
      G.ward = 0; G.guardTurns = 0; updateBadges();
      fxEl("flash", { background: "rgba(160,80,255,.45)" });
      popAt(window.innerWidth / 2, window.innerHeight * 0.45, "💥 守りの術式が破られた！", "info");
      await sleep(700);
    }
    EFFECTS.cosmic("#ff5a1a"); fxEl("vignette", { "--c": "rgba(40,0,60,.85)" });
    await sleep(380);
    shake();
    // 業火：最大HPの damage_rate の割合ダメージ（防御で減らない）。必ず黒炎になる
    hurt(G.cfg.ally.max_hp * sp.damage_rate * mult, r.left + r.width / 2 + 70, r.top - 10);
    newStatus = inflict("black_flame");
  } else {
    if (espell) {                                    // 敵の魔法：属性のエフェクト
      const fx = { fire: "fire", thunder: "thunder", ice: "magic", dark: "void" }[espell.element] || "magic";
      (EFFECTS[fx] || EFFECTS.magic)(espell.color);
    } else (EFFECTS[e.effect.type] || EFFECTS.slash)(e.effect.color);
    await sleep(380);
    shake();
    hurt((G.guardTurns > 0 ? e.hit_damage_guard : e.hit_damage) * mult, r.left + r.width / 2 + 70, r.top - 10);
    // 3. 新しい状態異常（上で抽選した物）。同じ物は重ならず、残りターンが最初に戻る
    if (preStatus) newStatus = inflict(preStatus);
  }
  if (navigator.vibrate) navigator.vibrate(90);
  if (G.guardTurns > 0) G.guardTurns--;
  if (G.eBreak > 0) G.eBreak--;
  if (G.ward > 0) G.ward--;
  updateBadges();
  if (newStatus && G.allyHp > 1e-9) {
    const st = G.cfg.status[newStatus];
    await sleep(350);
    popAt(window.innerWidth / 2, window.innerHeight * 0.55, `${st.icon} ${st.name}！`, "info");
  }
  await sleep(700);
  bub.style.display = "none";
  if (G.allyHp <= 1e-9) {               // 倒れそう：はじめての人はアステルが必ず助けに来る。精霊の羽があれば使うか聞く
    const r = await saveFromDown();
    if (r === "won") return;
    if (r !== "saved") return finish("lose");
    await sleep(G.cfg.pause_ms); return playerTurn();
  }
  // アステルの援護：敵の攻撃のあと、まれに空からやってくる（1回の戦闘で1度だけ）
  const as = G.cfg.assist;
  if (as && as.random && !G.assistRandom && G.assistImages && Math.random() < as.chance) {
    if (await astelAssist("random")) return;
  }
  await sleep(G.cfg.pause_ms);
  playerTurn();
}

// ---------------------------------------------------------------------------
// 宇宙龍の覚醒（HPが半分を切ったら、敵のターンの始めに1度だけ）
// ---------------------------------------------------------------------------
// 敵にダメージを与える。覚醒する前の宇宙龍は、HPが1より下にならない（覚醒する前には倒せない）
function hitEnemy(amount) {
  const floor = G.cfg.awaken && !G.awakened ? 1 : 0;
  const d = Math.max(0, Math.min(amount, G.enemyHp - floor));
  G.enemyHp -= d; G.dealt += d;
  return d;
}
function rocks(n, ms) {
  for (let i = 0; i < n; i++) setTimeout(() => {
    const r = document.createElement("div"); r.className = "rock";
    const s = 10 + Math.random() * 34;
    r.style.left = Math.random() * 100 + "vw"; r.style.setProperty("--s", s + "px");
    r.style.setProperty("--d", (0.9 + Math.random() * 0.9) + "s"); r.style.setProperty("--r", (Math.random() * 720 - 360) + "deg");
    $("app").appendChild(r); setTimeout(() => r.remove(), 2000);
  }, Math.random() * ms);
}
async function awaken() {
  const A = G.cfg.awaken, args = G.awakenArgs || {};
  G.awakened = true; setButtons(false);
  const bub = $("bubble");
  bub.style.setProperty("--bubble", "#ff7a3a"); bub.textContent = "……グ、ググ……ォォォ……"; bub.style.display = "block";
  // 1. 地鳴り：だんだん強くゆれ、石が落ち、砂ぼこりが上がる
  $("stage").classList.add("quake"); $("fx").classList.add("quake");
  if (navigator.vibrate) navigator.vibrate([200, 80, 260, 60, 400]);
  const dust = document.createElement("div"); dust.className = "dust"; $("app").appendChild(dust); setTimeout(() => dust.remove(), 3300);
  rocks(10, 1200);
  await sleep(1200);
  bub.style.display = "none";
  $("stage").classList.add("hard"); $("fx").classList.add("hard");
  rocks(22, 1400);
  fxEl("dim", {});
  // 2. 姿が変わる（新しい絵を上に重ねて、じわっと入れかえる）
  const old = $("stage").querySelector(".st-scene");
  if (args.scene) {
    const tmp = document.createElement("div"); tmp.innerHTML = args.scene;
    const next = tmp.firstElementChild; next.classList.add("awake-in");
    if (old) old.querySelector(".st-target")?.classList.remove("st-target");   // 当たり判定は新しい絵で
    $("stage").appendChild(next);
    await sleep(500);
    next.classList.add("on");
  }
  await sleep(900);
  const crack = document.createElement("div"); crack.className = "crack"; $("app").appendChild(crack); setTimeout(() => crack.remove(), 1100);
  if (navigator.vibrate) navigator.vibrate([500]);
  await sleep(700);
  $("stage").classList.remove("quake", "hard"); $("fx").classList.remove("quake", "hard");
  if (old) old.remove();
  const cur = $("stage").querySelector(".st-scene"); if (cur) cur.classList.remove("awake-in", "on");
  if (args.mask) { G.hitMask = null; prepareHitMask(args.mask); }
  if (G.multi) layoutFoeBars();
  // 3. 強さが変わる（攻撃・防御。こちらの与えるダメージも計算し直した値にする）
  const e = G.cfg.enemy, a = G.cfg.ally;
  Object.assign(e, { name: A.name, title: A.title, lines: A.lines, effect: A.effect, atk: A.atk, def: A.def,
                     hit_damage: A.hit_damage, hit_damage_guard: A.hit_damage_guard });
  a.tap_damage = A.tap_damage; a.tap_damage_up = A.tap_damage_up;
  if (A.heavy) e.heavy = A.heavy;
  if (G.multi) { G.foes[0].tap = { ...G.foes[0].tap, tap_damage: A.tap_damage, tap_damage_up: A.tap_damage_up }; G.foes[0].hp = G.enemyHp; }
  if (G.cfg.skill && A.skill_damage != null) G.cfg.skill.damage = A.skill_damage;
  $("enemyName").textContent = `Lv.${e.lv} ${A.name}`;
  await banner("覚醒", `${A.name} ― ${A.title}`, 1700, "lose");
  // 4. 減っているHPの一部を回復
  const heal = (e.max_hp - G.enemyHp) * A.heal_rate;
  if (heal > 0) {
    G.enemyHp = Math.min(e.max_hp, G.enemyHp + heal); updateBars();
    const c = enemyCenter(); popAt(c.x, c.y, "+" + fmt(heal), "heal");
    fxEl("vignette", { "--c": "rgba(120,255,170,.35)" });
    await sleep(900);
  }
  G.specialNext = true;     // 覚醒して最初の攻撃は、必ず大技
}
async function specialScene(name, src, focus, color) {
  const sp = $("special");
  sp.querySelector(".name").textContent = name;
  const img = sp.querySelector("img.main"), bg = sp.querySelector("img.bg");
  if (src && img.getAttribute("src") !== src) { img.src = src; bg.src = src; }
  img.style.objectPosition = focus || "35% 50%"; img.style.transformOrigin = focus || "50% 50%";
  // 絵より画面がずっと縦長なら、切りすぎないよう全体を見せる
  const ratio = (img.naturalWidth || 16) / (img.naturalHeight || 9);
  const k = ratio / (window.innerWidth / window.innerHeight);   // 絵と画面の縦横の違い
  sp.classList.toggle("fit", k > 4.5 || k < 0.6);
  img.style.animation = "none"; void img.offsetWidth; img.style.animation = "";
  const nm = sp.querySelector(".name"); nm.style.animation = "none"; void nm.offsetWidth; nm.style.animation = "";
  nm.style.textShadow = color ? `0 0 10px ${color}, 0 0 26px ${color}, 0 0 44px rgba(0,0,0,.6), 0 3px 0 #000` : "";   // 味方の技は、その人の色で光らせる
  sp.style.display = "block";
  if (navigator.vibrate) navigator.vibrate([120, 60, 300]);
  await sleep(2200);
  sp.style.display = "none";
}

function inflict(id) {
  if (id === "black_flame" && G.ward > 0) return null;   // 封炎の巻物：新しい黒炎にかからない
  if ((G.cfg.ally.immune || []).includes(id)) {          // 聖霊の加護：基本の状態異常にかからない
    popAt(window.innerWidth / 2, window.innerHeight * 0.55, `✨ 聖霊の加護で ${G.cfg.status[id].name}を防いだ！`, "info");
    return null;
  }
  const st = G.cfg.status[id];
  let turns = st.turns;
  if (id === "thunder") {
    turns = st.turns_min + Math.floor(Math.random() * (st.turns_max - st.turns_min + 1));
    if (st.halve) turns = Math.ceil(turns / 2);      // 雷よけの指輪：ターン数を半分（切り上げ）
  }
  G.status[id] = turns;
  return id;
}

// ---------------------------------------------------------------------------
// やめる
// ---------------------------------------------------------------------------
$("quit").onclick = () => {
  if (!G || G.phase === "end") return;
  // エクストラステージは、確認なしで逃げられる（負けにならない）
  if (G.cfg.extra) { if (G.phase === "player") finish("escape"); return; }
  if (G.phase !== "player") return;                // 連打中・敵のターン中は押せない
  $("confirm").style.display = "flex";
};
$("cancelQuit").onclick = () => { $("confirm").style.display = "none"; };
$("doQuit").onclick = () => { $("confirm").style.display = "none"; finish("quit"); };

// ---------------------------------------------------------------------------
// 終わり
// ---------------------------------------------------------------------------
async function finish(result) {
  if (G.phase === "end") return;
  G.phase = "end"; setButtons(false); $("sheet").classList.remove("open"); $("magicSheet").classList.remove("open");
  $("chant").classList.remove("on"); $("app").classList.remove("chanting");
  $("tapzone").classList.remove("on"); $("gearBtn").style.visibility = ""; $("app").classList.remove("tapping"); $("timer").style.display = "none"; $("combo").style.display = "none"; $("bubble").style.display = "none";
  $("warn").classList.remove("on"); $("stun").classList.remove("on"); $("dark").classList.remove("on"); $("btnEnd").classList.remove("on");
  $("hint").textContent = "";
  if (result === "lose") $("allyIcon").classList.add("down");
  const elapsed = performance.now() - G.startAt;
  if (result === "win" && G.cfg.end_line) { fxEl("dim", {}); await banner("？？？", G.cfg.end_line, 2800, "lose"); }
  if (result === "win") await banner("撃破！", `${G.turn}ターン ／ ${G.hits}ヒット`, 0, "win");
  else if (result === "escape") await banner("にげた！", "先へ進もう", 0, "");
  else if (result === "lose") await banner("やられた…", `敵の残りHP ${displayHp(G.enemyHp).toLocaleString()}`, 0, "lose");
  const value = {
    round: G.round, result,
    ally_hp: Math.max(0, G.allyHp), enemy_hp: Math.max(0, G.enemyHp), turns: G.turn,
    taps: G.taps, hits: G.hits, misses: G.misses, damage_dealt: G.dealt, damage_taken: G.taken,
    enemy_attacks: G.enemyAttacks, used: G.used, elapsed_ms: Math.round(elapsed), charge: G.charge,
    ally_mp: Math.max(0, G.mp), used_mp: G.usedMp, crits: G.crits, casts: G.casts, chant_taps: G.chantTaps,
    assist: G.assistRescue ? "rescue" : G.assistRandom ? "random" : G.assistFeather ? "feather" : null,
  };
  setTimeout(() => Streamlit.setValue(value), result === "quit" ? 0 : result === "escape" ? 1000 : 1600);   // 結果を少し見せてから Python に返す
}

Streamlit.ready();
</script>
