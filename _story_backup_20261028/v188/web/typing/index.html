<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="streamlit.js"></script>
<script src="common.js"></script>
<script src="kana.js"></script>
<script src="robot.js"></script>
<script src="typing.js"></script>
<script src="code.js"></script>
<script>
  // Streamlit から app の種類を受けとって、そのゲームを始める
  let started = false;
  Streamlit.ready((args) => {
    if (started) return;
    started = true;
    const root = document.getElementById("app");
    const done = (value) => Streamlit.setValue(value);
    if (args.app === "code") new CodeGame(root, args, done);
    else if (args.app === "sandbox") new Sandbox(root, args);
    else new TypingGame(root, args, done);
  });
</script>
</body>
</html>
