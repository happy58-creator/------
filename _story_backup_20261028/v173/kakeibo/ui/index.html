<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家計簿</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#22262e; --sub:#7a808c; --line:#e7e9ee;
  --orange:#F08A2C; --green:#2DB56A; --red:#E5533A; --blue:#3586E0; --accent:#5068FF;
  --r:16px; --gap:12px; --shadow:0 2px 10px rgba(20,30,60,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;font-size:15px}
body{overflow:hidden}
#scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#app{max-width:560px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
.title{font-size:20px;font-weight:800;text-align:center;margin:4px 0 14px;letter-spacing:.04em}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:var(--gap)}
.muted{color:var(--sub)}
.small{font-size:12px}
/* 合計 */
.sum{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.sum div+div{border-left:1px solid var(--line)}
.sum span{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
.sum b{font-size:17px;white-space:nowrap}
.inc{color:var(--blue)} .exp{color:var(--red)}
/* メニューのタイル（すべて同じ大きさ） */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.tile.wide{grid-column:1/-1;height:64px;flex-direction:row;gap:10px}
.tile{height:104px;border-radius:var(--r);color:#b24d72;background:linear-gradient(160deg,#fde7ee,#f8d3df);border:1px solid #f4c4d4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 12px rgba(220,120,150,.15);font-weight:800;font-size:16px;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile .ic{width:32px;height:32px}
/* お知らせ */
.alert{display:flex;gap:10px;align-items:center;background:#fff6ea;border:1px solid #ffe0b8;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.alert b{white-space:nowrap}
/* 月の見出し */
.mnav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:var(--gap)}
.mnav .arrow{height:44px;font-size:26px;color:var(--sub)}
.mnav .head{background:#fdf3df;border-radius:12px;text-align:center;padding:9px 4px;font-weight:800;font-size:17px}
.mnav .head small{display:block;font-weight:500;font-size:11px;color:var(--sub)}
/* 切りかえ */
.seg{display:grid;grid-template-columns:1fr 1fr;background:#eceef2;border-radius:999px;padding:4px;margin-bottom:var(--gap)}
.seg button{height:40px;border-radius:999px;font-weight:800;color:var(--sub)}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg.k button.on.e{color:var(--orange)} .seg.k button.on.i{color:var(--blue)}
/* 入力 */
.field{display:grid;grid-template-columns:64px 1fr;align-items:center;min-height:52px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-size:13px;color:var(--sub);font-weight:700}
.field input,.field select{width:100%;border:0;outline:0;background:transparent;font-size:16px;padding:10px 0}
.datebox{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;text-align:center}
.datebox button{height:40px;font-size:22px;color:var(--sub)}
.datebox .d{position:relative;font-weight:700}
.datebox .d input{position:absolute;inset:0;opacity:0;width:100%}
.amount{display:flex;align-items:center;gap:4px;font-size:24px;font-weight:800}
.amount input{font-size:24px;font-weight:800;text-align:right}
.sec{font-weight:800;margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec .link{font-size:13px;color:var(--accent);font-weight:700}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{aspect-ratio:1/1;background:linear-gradient(160deg,#fdeef3,#fadbe5);color:#b24d72;border-radius:14px;border:2px solid #f6cfdc;box-shadow:0 2px 8px rgba(220,120,150,.12);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;overflow:hidden}
.cat .ic{width:26px;height:26px}
.cat span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.cat.on{border-color:#d9658e;background:linear-gradient(160deg,#fbd5e1,#f6bfd1);box-shadow:0 0 0 3px rgba(217,101,142,.18)}
.cat.add{color:#c98aa2;background:#fff;border:2px dashed #f2c3d3;box-shadow:none}
.big{display:block;width:100%;height:56px;border-radius:999px;background:var(--orange);color:#fff;font-size:17px;font-weight:800;margin-top:18px;
  box-shadow:0 6px 16px rgba(240,138,44,.35)}
.big.blue{background:var(--blue);box-shadow:0 6px 16px rgba(53,134,224,.3)}
.btn{display:block;width:100%;height:46px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--red)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* カレンダー */
.cal{display:grid;grid-template-columns:repeat(7,1fr);background:var(--line);gap:1px;border-radius:12px;overflow:hidden;margin-bottom:var(--gap)}
.cal .w{background:#eceef2;text-align:center;font-size:12px;padding:5px 0;font-weight:700}
.cal .c{background:#fff;height:62px;padding:3px 4px;font-size:12px;display:flex;flex-direction:column;overflow:hidden}
.cal .c.out{background:#f7f8fa;color:#bbb}
.cal .c.today{background:#fdf3df}
.cal .c.today .n{background:var(--orange);color:#fff;border-radius:999px;width:20px;height:20px;display:grid;place-items:center}
.cal .n{font-weight:700;font-size:12px}
.cal .a{margin-top:auto;text-align:right;font-size:10px;line-height:1.3;white-space:nowrap}
.sun{color:var(--red)} .sat{color:var(--blue)}
.cal .c.out .sun,.cal .c.out .sat{color:#ccc}
.cal .c.pick{outline:2px solid var(--accent);outline-offset:-2px}
/* 一覧 */
.day{font-weight:800;font-size:13px;color:var(--sub);margin:16px 4px 6px}
.list{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:grid;grid-template-columns:38px 1fr auto auto;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:58px}
.item:last-child{border-bottom:0}
.item .ic{width:38px;height:38px;border-radius:12px;background:#f2f3f6;display:grid;place-items:center;font-size:20px}
.item .t{min-width:0}
.item .t b{display:block;font-size:14px}
.item .t span{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .v{font-weight:800;white-space:nowrap}
.item .del{width:32px;height:32px;border-radius:10px;color:#b4b8c2;font-size:18px}
.empty{text-align:center;color:var(--sub);padding:28px 0}
/* レポート */
.formula{text-align:center;background:#fff;border-radius:999px;padding:10px;font-weight:800;box-shadow:var(--shadow);margin-bottom:var(--gap);font-size:15px}
.chart svg{display:block;width:100%;height:auto}
.legend .item{grid-template-columns:12px 28px 1fr auto;min-height:48px;padding:9px 14px}
.dot{width:12px;height:12px;border-radius:50%}
/* 予算 */
.brow{padding:12px 14px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brow .top b{font-size:14px}
.bar{height:10px;background:#eef0f3;border-radius:999px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;border-radius:999px}
.brow .bot{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.brow.total b{font-size:16px}
.bin{display:grid;grid-template-columns:1fr 140px;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line)}
.bin input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;text-align:right;font-size:16px}
/* サブスク */
.sub{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:14px;border-bottom:1px solid var(--line);align-items:center}
.sub:last-child{border-bottom:0}
.sub .nm{font-weight:800}
.sub .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eef0ff;color:var(--accent);margin-left:6px;vertical-align:2px}
.sub .tag.y{background:#fff1e3;color:var(--orange)}
.sub .when{font-size:12px;color:var(--sub)}
.sub .when.soon{color:var(--red);font-weight:700}
.sub .acts{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.sub .acts button{height:38px;border-radius:10px;background:#f2f3f6;font-weight:700;font-size:14px}
.sub .acts button.pay{background:#e8f7ee;color:var(--green)}
/* カテゴリ編集 */
.crow{display:grid;grid-template-columns:52px 1fr 34px 34px 34px;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.crow input{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:16px;width:100%}
.crow input.e{text-align:center;font-size:20px;padding:0}
.crow button{height:34px;border-radius:9px;background:#f2f3f6;color:var(--sub)}
/* フッター */
#foot{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(calc(100% - 20px),540px);
  background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;
  box-shadow:0 8px 28px rgba(20,30,60,.16),0 0 0 1px rgba(0,0,0,.04);display:grid;grid-template-columns:repeat(5,1fr);padding:6px;z-index:10}
#foot button{height:56px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:#3a3f48}
#foot button svg{width:24px;height:24px}
#foot button.on{background:#fde7ee;color:#d9658e}
/* 下からのシート・確認 */
#modal{position:fixed;inset:0;background:rgba(15,20,30,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.show{display:flex}
#modal .sheet{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90%;overflow-y:auto;animation:up .18s ease-out}
#modal .sheet.center{border-radius:20px;margin:auto 16px;align-self:center}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-80px);background:#22262e;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;transition:transform .25s;z-index:30;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.show{transform:translate(-50%,0)}
#sync{position:fixed;right:14px;top:12px;font-size:11px;color:var(--sub);background:#fff;border-radius:999px;padding:3px 9px;box-shadow:var(--shadow);display:none;z-index:9}

/* ピンク（入力・予算） */
:root{--pink:#d9658e;--pinkL:#fde7ee}
.big.pink{background:linear-gradient(#e889a9,#d9658e);box-shadow:0 6px 16px rgba(217,101,142,.32)}
.btn.pri.pink{background:#d9658e;border-color:#d9658e}
.seg.k button.on.e{color:var(--pink)}
.li{width:22px;height:22px;display:block}
.item .ic{color:#b24d72;background:var(--pinkL)}
.item .ic .li{width:21px;height:21px}
.lic{color:#b24d72;display:grid;place-items:center}
.bname{display:inline-flex;align-items:center;gap:8px}
.bic{width:30px;height:30px;border-radius:9px;background:var(--pinkL);color:#b24d72;display:grid;place-items:center;flex:none}
.bic .li{width:18px;height:18px}
.cic{width:44px;height:42px;border-radius:10px;background:var(--pinkL) !important;color:#b24d72 !important;display:grid;place-items:center;border:1px solid #f4c4d4 !important}
.ipick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ipick button{aspect-ratio:1/1;border-radius:12px;background:#fff;color:#b24d72;display:grid;place-items:center;border:2px solid #f4d6e0}
.ipick button.on{border-color:#d9658e;background:var(--pinkL)}
.ipick .li{width:24px;height:24px}

/* 入力：現金・クレカ */
.paybtn{margin-left:8px;flex:0 0 76px;width:76px;height:34px;padding:0;border-radius:999px;font-size:14px;line-height:1;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;align-self:center;box-sizing:border-box;vertical-align:middle;
  background:#eef7ee;color:#2a8c4a;border:1.5px solid #bfe3c8}
.amount input{flex:1 1 auto;min-width:0}
.paybtn.is-card{background:#eef2ff;color:#3a5bd0;border-color:#c5d0fa}
.ptag{font-style:normal;font-size:10px;font-weight:800;color:#3a5bd0;background:#eef2ff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
/* レポート：支出・収入・収支 */
.rsum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.rbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;min-width:0}
.rbox span{font-size:12px;color:#555;flex:none}
.rbox b{margin-left:auto;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbox b small{font-size:11px;margin-left:1px}
.rbox:not(.wide){flex-direction:column;align-items:stretch;gap:2px;padding:8px 12px}
.rbox:not(.wide) b{margin-left:0;text-align:right;font-size:clamp(15px,4.6vw,19px)}
.rbox.wide{grid-column:1/-1}
.rbox.wide b{font-size:22px}
.rf{height:28px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:800;border:1.5px solid;flex:none}
.rf0{color:#555;border-color:#d5d8de;background:#f4f5f7}
.rf1{color:#2a8c4a;border-color:#bfe3c8;background:#eef7ee}
.rf2{color:#3a5bd0;border-color:#c5d0fa;background:#eef2ff}
.rf3{color:#8a5a12;border-color:#f0d49a;background:#fff6e2}
.rf4{color:#b24d72;border-color:#f4c4d4;background:var(--pinkL)}
.paybtn.is-furi{background:#fff6e2;color:#8a5a12;border-color:#f0d49a}
.ptag.furi{color:#8a5a12;background:#fff6e2}
/* 予算の設定：外す・もどす・新しい項目 */
.bin3{display:grid;grid-template-columns:1fr 120px 34px;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.bin3:last-child{border-bottom:0}
.bin3 input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;text-align:right;font-size:16px}
.bx{width:34px;height:34px;border-radius:10px;background:#f2f3f6;color:#9aa0aa;font-size:15px}
.bx.add{background:var(--pinkL);color:#b24d72;font-size:20px}
.bname.muted{color:var(--sub)}
.newrow{display:grid;grid-template-columns:1fr 84px;gap:8px;padding:8px}
.newrow input{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px;width:100%;min-width:0}
.newrow .btn{height:44px}
/* 積立：項目・積立・計・支払 */
.tsumi .trow{display:grid;grid-template-columns:minmax(0,1fr) 70px 74px 46px 64px;gap:4px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line);min-height:56px}
.tsumi .trow:last-child{border-bottom:0}
.tsumi .th{min-height:0;padding:8px 10px;background:#fbf3f6;font-size:12px;font-weight:800;color:#b24d72}
.tsumi .th span:not(:first-child){text-align:center}
.tname{text-align:left;font-weight:800;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tname i{font-style:normal;color:#c9a1b2;margin-left:4px}
.tsumi input{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 6px;text-align:right;font-size:15px;color:#888;min-width:0}
.tsumi input.own{color:var(--ink);border-color:#f0bfd0;background:#fff8fb}
.tsumi .trow > b{text-align:right;font-size:13.5px;white-space:nowrap}
.tpay{font-size:11px;color:var(--sub);text-align:center;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:36px;padding:0 12px;border-radius:999px;background:#fff;border:1.5px solid #f0d3de;color:#8a5468;font-weight:700;font-size:13px}
.chip.sm{height:32px;min-width:34px;padding:0 6px;font-size:12px}
.chip.on{background:#d9658e;border-color:#d9658e;color:#fff}

.pkind{margin-left:auto;height:30px;width:76px;border-radius:999px;font-size:13px;font-weight:800;line-height:1;display:inline-flex;align-items:center;justify-content:center;
  background:#fff1f1;color:#d0503a;border:1.5px solid #f3c3b8}
.pkind.fill{background:#eef2ff;color:#3a5bd0;border-color:#c5d0fa}

.tsumi .trow{padding:9px 8px}
.tsumi input{font-size:14px;padding:0 5px}
.tsumi .trow > b{font-size:12.5px}
.tpay{font-size:10px}
.tmeyasu{text-align:right;font-weight:800;font-size:12.5px;line-height:1.15;white-space:nowrap}
.tmeyasu small{display:block;font-size:9px;font-weight:600;color:var(--sub)}
.tmeyasu.short{color:var(--red)} .tmeyasu.ok{color:var(--green)}
.lastpay{display:flex;align-items:center;gap:8px;margin:8px 2px 2px}
.lastpay input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:15px;background:#fff}

button.item.tap{width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer}
button.item.tap:last-child{border-bottom:0}
button.item.tap:active{background:#fdf2f6}
.chev{font-style:normal;color:#c9a1b2;margin-left:6px;font-weight:400}
.dhead{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;margin:4px 2px 6px}
.dhead div b{display:block;font-size:17px}
.dhead div span{font-size:12px;color:var(--sub)}
.dhead > b{font-size:18px}
.bic.big{width:44px;height:44px;border-radius:12px}
.bic.big .li{width:24px;height:24px}
.ipick{grid-template-columns:repeat(7,1fr)}

/* アイコンの名前（長い名前は … で切って、形をくずさない） */
.nrow{display:grid;grid-template-columns:30px 1fr 48px;gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line)}
.nrow:last-child{border-bottom:0}
.nrow input{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:16px;width:100%;min-width:0}
.nrow.unused .bic{opacity:.55}
.inuse{font-style:normal;font-size:10px;font-weight:800;color:#b24d72;background:var(--pinkL);border-radius:6px;padding:2px 5px;text-align:center}
.nrow1{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:10px}
.nrow1 input{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:17px;width:100%;min-width:0}
.rename{margin-left:8px;font-size:11px;font-weight:700;color:var(--accent);vertical-align:2px}
.legend .item .t b, .dhead div b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* キーボードが出ているあいだは、フッターを隠して、下に余白を足す（入力欄を上まで動かせるように） */
body.kbd #foot, body.kbd .foot { display:none !important; }
body.kbd #app, body.kbd .wrap { padding-bottom:55vh !important; }
</style>
</head>
<body>
<div id="scroll"><div id="app"></div></div>
<nav id="foot"></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="sync">保存中…</div>
<script>
"use strict";
// ===== Streamlit とのやりとり（ライブラリなしで、決まった形のメッセージを送る） =====
const SL = {
  send(type, extra) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, extra), "*"); },
  ready() { this.send("streamlit:componentReady", { apiVersion: 1 }); },

// ===== ログインの証明（24時間）をブラウザに保存する =====
const TOKEN = {
  get() {
    let t = "";
    try { t = localStorage.getItem("kb_token") || ""; } catch (e) {}
    if (!t) { try { const m = window.parent.document.cookie.match(/(?:^|; )kb_token=([^;]+)/); if (m) t = decodeURIComponent(m[1]); } catch (e) {} }
    return t;
  },
  set(t) {
    if (!t) return;
    const exp = +t.split(".")[0], left = Math.max(0, Math.floor(exp - Date.now() / 1000));
    try { localStorage.setItem("kb_token", t); } catch (e) {}
    try { window.parent.document.cookie = `kb_token=${encodeURIComponent(t)}; max-age=${left}; path=/; SameSite=Lax; Secure`; } catch (e) {}
  },
  clear() {
    try { localStorage.removeItem("kb_token"); } catch (e) {}
    try { window.parent.document.cookie = "kb_token=; max-age=0; path=/; SameSite=Lax; Secure"; } catch (e) {}
  },
};

const pad = n => String(n).padStart(2, "0");

}

// ---- 積立：項目ごとに「この月の積立額」は、その月かそれより前に入れた最後の金額（先月の金額が続く）----
const tItems = () => [...D.tsumi].sort((a, b) => int(a["並び"]) - int(b["並び"]));
const tLogs = (id, kind) => D.tlog.filter(l => l["項目ID"] === id && l["種類"] === kind);
function tAmt(it, m) {
  if (!it || m < String(it["開始月"] || "0000-00")) return 0;
  let best = null;
  for (const l of tLogs(it.ID, TSUMI)) if (l["月"] <= m && (!best || l["月"] > best["月"])) best = l;
  return best ? int(best["金額"]) : 0;
}
function tSaved(it, m) {          // その月までに積み立てた合計
  let sum = 0, k = String(it["開始月"] || m);
  for (let n = 0; k <= m && n < 600; n++, k = shiftM(k, 1)) sum += tAmt(it, k);
  return sum;
}
const tOut = id => D.tlog.filter(l => l["項目ID"] === id && (l["種類"] === "支払" || l["種類"] === "補填"));     // どちらも計から引く
const tPaid = (it, m) => tOut(it.ID).filter(l => l["月"] <= m).reduce((a, l) => a + int(l["金額"]), 0);
const tBal = (it, m) => tSaved(it, m) - tPaid(it, m);
// 支払の間かくの月数
const CYCLE_M = { 毎月: 1, "2か月ごと": 2, "3か月ごと": 3, "4か月ごと": 4, "5か月ごと": 5, 半年ごと: 6, 年1回: 12, "2年に1回": 24, "3年に1回": 36, "4年に1回": 48, "5年に1回": 60 };
const payBase = it => String((it && it["支払"]) || "").replace(/（.*）/, "");
const payMon = it => +((String((it && it["支払"]) || "").match(/（(\d+)月）/) || [])[1] || 0);
const cycleOf = it => CYCLE_M[payBase(it)] || 12;
const mDiff = (a, b) => (+b.slice(0, 4) * 12 + +b.slice(5, 7)) - (+a.slice(0, 4) * 12 + +a.slice(5, 7));    // a から b までの月数
// 次の支払の月：前回の支払日 → 支払う月 → 始めた月 の順で決める
function nextPay(it, m) {
  const N = cycleOf(it), last = String(it["前回支払日"] || "");
  let k;
  if (/^\d{4}-\d{2}/.test(last)) k = shiftM(last.slice(0, 7), N);
  else if (payMon(it)) { k = `${m.slice(0, 4)}-${pad(payMon(it))}`; if (k < m) k = shiftM(k, 12); return k; }
  else k = shiftM(String(it["開始月"] || m), N);
  for (let n = 0; k < m && n < 200; n++) k = shiftM(k, N);
  return k;
}
// 目安：固定＝月々の金額。逆算＝（合計額 − 先月までの計）÷ 次の支払までの残りの月数（今月をふくむ）
function meyasu(it, m) {
  if (it["目安"] === "逆算" && int(it["合計額"]) > 0) {
    const rest = int(it["合計額"]) - tBal(it, shiftM(m, -1)), left = Math.max(1, mDiff(m, nextPay(it, m)));
    return { v: Math.max(0, Math.ceil(rest / left)), mode: "逆算", left };
  }
  return { v: int(it["月額"]), mode: "固定" };
}

function donut(items, total) {
  const R1 = 88, R0 = 54, cx = 100, cy = 100; let ang = -Math.PI / 2;
  const pt = (r, t) => `${(cx + r * Math.cos(t)).toFixed(2)} ${(cy + r * Math.sin(t)).toFixed(2)}`;
  const segs = items.map(([, v], i) => {
    const col = PALETTE[i % PALETTE.length];
    if (items.length === 1) return `<circle cx="${cx}" cy="${cy}" r="${(R1 + R0) / 2}" fill="none" stroke="${col}" stroke-width="${R1 - R0}"/>`;
    const a0 = ang, a1 = ang + v / total * Math.PI * 2; ang = a1;
    const big = a1 - a0 > Math.PI ? 1 : 0;
    return `<path d="M${pt(R1, a0)} A${R1} ${R1} 0 ${big} 1 ${pt(R1, a1)} L${pt(R0, a1)} A${R0} ${R0} 0 ${big} 0 ${pt(R0, a0)} Z" fill="${col}" stroke="#fff" stroke-width="1.5"/>`;
  });
  return `<svg viewBox="0 0 200 200" style="max-width:240px;margin:0 auto">${segs.join("")}
    <text x="100" y="94" text-anchor="middle" font-size="12" fill="#7a808c">${S.rf === TSUMI ? "積立" : "支出"}</text>
    <text x="100" y="116" text-anchor="middle" font-size="18" font-weight="800" fill="#22262e">${yen(total)}</text></svg>`;
}
function barsFor(ms, cur) {

  const max = Math.max(1, ...t.map(x => Math.max(x.inc, x.exp)));
  const W = 360, H = 230, mid = 110, h = 92, bw = 14, step = (W - 30) / 12;
  let g = `<line x1="24" x2="${W}" y1="${mid}" y2="${mid}" stroke="#d5d8de"/>`;
  const nice = max >= 10000 ? `${Math.round(max / 1000).toLocaleString()}千` : max.toLocaleString();
  g += `<text x="0" y="${mid - h + 4}" font-size="9" fill="#9aa0aa">${nice}</text><text x="0" y="${mid + h + 4}" font-size="9" fill="#9aa0aa">-${nice}</text>`;
  ms.forEach((m, i) => {
    const x = 30 + i * step + (step - bw) / 2, hi = t[i].inc / max * h, he = t[i].exp / max * h, on = m === cur;
    g += `<rect x="${x}" y="${mid - hi}" width="${bw}" height="${hi}" rx="3" fill="#2DB56A" opacity="${on ? 1 : .75}"/>`;
    g += `<rect x="${x}" y="${mid}" width="${bw}" height="${he}" rx="3" fill="#F08A2C" opacity="${on ? 1 : .75}"/>`;
    g += `<text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle" font-size="10" fill="${on ? "#22262e" : "#9aa0aa"}" font-weight="${on ? 800 : 400}">${+m.slice(5)}月</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

// その月（年間なら、その年）の、そのアイコンの記録の一覧

// 項目・積立・計・支払。積立の欄はこの月の積立額（入れなければ先月の金額のまま）。計はこの月までの残高（積み立てた合計 − 支払った分）

    <button class="del" data-a="tpdel" data-id="${esc(l.ID)}">✕</button></div>`).join("")}</div>` : ""}
  <div class="small muted" style="margin:8px 4px 0">${S.month.replace("-", "年")}月の計：${yen(tBal(it, S.month))}</div>`}
  <button class="big pink" data-a="tsave">${t.isNew ? "追加する" : "保存する"}</button>
  ${t.isNew ? "" : `<button class="btn danger" style="margin-top:10px" data-a="tdel">この項目を消す</button>`}
  <button class="btn" style="margin-top:10px" data-a="mclose">閉じる</button>`);
}
// 合計額 ÷ 支払の間かく ＝ 月々の平均
function avgNote(t) {
  const tot = int(t["合計額"]), N = cycleOf(t);
  return tot > 0 ? `合計額 ${yen(tot)} ÷ ${N}か月 ＝ 月々の平均 ${yen(Math.ceil(tot / N))}（月々の金額は変えられます）` : "合計額を入れると、支払の間かくから月々の平均を出します";
}
function fillAvg() {          // 合計額か支払を変えたら、月々の金額に平均を入れる（そのあと自由に変えられる）
  const tot = int(tDraft["合計額"]); if (tot <= 0) return;
  tDraft["月額"] = String(Math.ceil(tot / cycleOf(tDraft)));
  const el = document.querySelector('#sheet [data-t="月額"]'); if (el) el.value = tDraft["月額"];
  const n = document.getElementById("avgNote"); if (n) n.textContent = avgNote(tDraft);
}
// この月の積立額を入れる（その月から先に続く）
function setTsumi(id, m, amt) {
  const rows = D.tlog.filter(l => !(l["項目ID"] === id && l["種類"] === TSUMI && l["月"] === m));
  rows.push({ ID: uid(), 項目ID: id, 月: m, 種類: TSUMI, 金額: amt });
  act({ type: "save_table", table: "積立記録", rows });
}

function saveBudInputs() { if (S.budDraft) appEl.querySelectorAll("[data-bud]").forEach(i => S.budDraft.amt[i.dataset.bud] = i.value); }
// ===== 操作 =====
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) { go(g.dataset.go); return; }
  const b = e.target.closest("[data-a]");
  if (!b) { if (e.target.id === "modal") closeModal(); return; }
  const a = b.dataset.a, v = b.dataset.v;
  switch (a) {
    case "mprev": S.month = shiftM(S.month, -1); S.calPick = null; render(); break;
    case "mnext": S.month = shiftM(S.month, 1); S.calPick = null; render(); break;
    case "rmode": S.rep = v; render(); break;
    case "yprev": S.month = shiftM(S.month, -12); render(); break;
    case "ynext": S.month = shiftM(S.month, 12); render(); break;
    case "kind": S.kind = v; render(true); break;
    case "dprev": S.date = addDays(S.date, -1); render(true); break;
    case "dnext": S.date = addDays(S.date, 1); render(true); break;
    case "cat": S.cat[S.kind] = v; render(true); break;
    case "submit": {
      const amt = int(S.amount);
      if (amt <= 0) { toast("金額を入れてください"); appEl.querySelector('[data-b="amount"]').focus(); return; }
      if (!S.cat[S.kind]) { toast("カテゴリーを選んでください"); return; }
      act({ type: "add_record", rec: { ID: uid(), 日付: S.date, 種類: S.kind, 金額: amt, カテゴリ: S.cat[S.kind], メモ: S.memo.trim(), 支払方法: S.kind === EXP ? S.pay : "", 登録日時: new Date().toISOString().slice(0, 16).replace("T", " ") } });
      toast(`記録しました　${S.cat[S.kind]} ${yen(amt)}${S.kind === EXP && S.pay !== CASH ? `（${S.pay}）` : ""}`);
      S.amount = ""; S.memo = ""; render(true);
      break;
    }
    case "pick": S.calPick = v || null; render(true); break;
    case "delrec": {
      const r = D.records.find(x => x.ID === b.dataset.id); if (!r) return;
      confirmBox(`${dlabel(r["日付"])}の<br>${esc(r["カテゴリ"])} ${yen(int(r["金額"]))} を消しますか？`, "消す", () => { act({ type: "delete_record", rid: r.ID }); toast("消しました"); });
      break;
    }
    case "budedit": S.budEdit = true; S.budDraft = null; render(); scrollEl.scrollTop = 0; break;
    case "budcancel": S.budEdit = false; S.budDraft = null; render(); break;
    case "budsave": {
      saveBudInputs(); const dr = S.budDraft, hid = new Set(dr.hidden);
      if (dr.added.length) {          // 新しい項目は、支出のカテゴリーにも入れる（「その他」の前）
        const rows = [...D.cats], at = rows.findIndex(c => c["種類"] === EXP && c["名前"] === "その他");
        const add = dr.added.map(n => ({ 種類: EXP, 名前: n, アイコン: "i:" + (NAME_ICON[n] || "tag") }));
        rows.splice(at >= 0 ? at : rows.filter(c => c["種類"] === EXP).length, 0, ...add);
        act({ type: "save_cats", rows });
      }
      const names = [...cats(EXP).map(c => c["名前"])];
      const rows = names.map(n => ({ カテゴリ: n, 予算: int(dr.amt[n]), 表示: hid.has(n) ? "0" : "" })).filter(r => r["予算"] > 0 || r["表示"] === "0" || String(dr.amt[r["カテゴリ"]]) !== "");
      act({ type: "save_budgets", rows }); S.budEdit = false; S.budDraft = null; toast("予算を保存しました"); render(); break;
    }
    case "paym": S.pay = PAY_METHODS[(PAY_METHODS.indexOf(S.pay) + 1) % PAY_METHODS.length]; render(true); break;
    case "rf": S.rf = RFILTER[(RFILTER.indexOf(S.rf) + 1) % RFILTER.length]; render(true); break;
    case "rdetail": showDetail(v, b.dataset.k); break;
    case "toshop": SL.value({ queue: QUEUE, go: "kaimono", gid: uid() }); break;     // 買い物リストのページへ（ログインはそのまま）
    case "iname1": {          // レポートの一覧から、そのアイコンの名前だけ変える
      modal(`<div class="title" style="margin-top:0">アイコンの名前</div>
        <div class="card nrow1"><span class="bic big">${svgIcon(v)}</span><input id="iname1" value="${esc(iconLabel(v))}" placeholder="${esc(ICON_LABEL[v] || "")}" maxlength="${ICON_NAME_MAX}"></div>
        <div class="small muted" style="margin:-4px 4px 10px">${ICON_NAME_MAX}文字まで。空にすると、はじめの名前（${esc(ICON_LABEL[v] || "")}）にもどります</div>
        <div class="row2"><button class="btn" data-a="mclose">やめる</button><button class="btn pri pink" data-a="iname1save" data-v="${v}">保存する</button></div>`, true);
      setTimeout(() => { const el = document.getElementById("iname1"); if (el) { el.focus(); el.select(); } }, 50);
      break;
    }
    case "iname1save": {
      const name = (document.getElementById("iname1").value || "").trim().slice(0, ICON_NAME_MAX);
      const rows = (D.inames || []).filter(x => x["キー"] !== v);
      if (name && name !== ICON_LABEL[v]) rows.push({ キー: v, 名前: name });
      act({ type: "save_table", table: "アイコン名", rows }); closeModal(); toast("名前を変えました"); break;
    }
    case "insave": {
      appEl.querySelectorAll("[data-iname]").forEach(i => S.inDraft[i.dataset.iname] = i.value);
      const rows = Object.entries(S.inDraft).map(([k, n]) => [k, String(n || "").trim().slice(0, ICON_NAME_MAX)]).filter(([k, n]) => n && n !== ICON_LABEL[k]).map(([k, n]) => ({ キー: k, 名前: n }));
      act({ type: "save_table", table: "アイコン名", rows }); S.inDraft = null; toast("アイコンの名前を保存しました"); go("cats"); break;
    }
    case "bhide": case "bshow": {
      saveBudInputs(); const h = new Set(S.budDraft.hidden);
      if (a === "bhide") h.add(v); else h.delete(v);
      S.budDraft.hidden = [...h]; render(true); break;
    }
    case "badd": {
      saveBudInputs(); const n = (document.getElementById("budNew").value || "").trim();
      if (!n) { toast("項目の名前を入れてください"); return; }
      if (cats(EXP).some(c => c["名前"] === n) || S.budDraft.added.includes(n)) {
        S.budDraft.hidden = S.budDraft.hidden.filter(x => x !== n); toast("その項目はもうあります（予算に表示しました）"); render(true); return;
      }
      S.budDraft.added.push(n); toast(`「${n}」を追加しました（保存で決まります）`); render(true); break;
    }
    case "tnew": tSheet(""); break;
    case "tedit": tSheet(b.dataset.id); break;
    case "tpay": tDraft["支払"] = v === "毎月" ? v : v + ((String(tDraft["支払"]).match(/（\d+月）/) || [""])[0]); fillAvg(); drawT(); break;
    case "tmode": tDraft["目安"] = v; drawT(); break;
    case "tlastclr": tDraft["前回支払日"] = ""; drawT(); break;
    case "tmon": tDraft["支払"] = String(tDraft["支払"]).replace(/（.*）/, "") + (v ? `（${v}月）` : ""); drawT(); break;
    case "tkind": tDraft.pkind = tDraft.pkind === "補填" ? "支払い" : "補填"; drawT(); break;
    case "tpaid": {
      const amt = int(tDraft.payAmt), fill = tDraft.pkind === "補填";
      if (amt <= 0) { toast(fill ? "補填した金額を入れてください" : "払った金額を入れてください"); return; }
      const lid = uid();
      act({ type: "save_table", table: "積立記録", rows: [...D.tlog, { ID: lid, 項目ID: tDraft.ID, 月: S.month, 種類: fill ? "補填" : "支払", 金額: amt }] });
      tDraft.payAmt = ""; toast(fill ? `${tDraft["名前"]}から ${yen(amt)} を補填しました` : "支払いを記録しました"); drawT(); break;
    }
    case "tpdel": {
      const l = D.tlog.find(x => x.ID === b.dataset.id);
      act({ type: "save_table", table: "積立記録", rows: D.tlog.filter(x => x.ID !== b.dataset.id) });
      if (l && l["種類"] === "補填" && D.records.some(r => r.ID === "fill-" + l.ID)) act({ type: "delete_record", rid: "fill-" + l.ID });   // 収入に入れた分も消す
      drawT(); break;
    }
    case "tsave": {
      const t = tDraft, name = String(t["名前"] || "").trim();
      if (!name) { toast("項目の名前を入れてください"); return; }
      const row = { ID: t.ID || uid(), 名前: name, 支払: t["支払"] || "", 開始月: t["開始月"], 並び: t["並び"], メモ: t["メモ"] || "",
        合計額: int(t["合計額"]) || "", 月額: int(t["月額"]) || "", 前回支払日: t["前回支払日"] || "", 目安: t["目安"] === "逆算" ? "逆算" : "固定" };
      if (t.isNew) {
        act({ type: "save_table", table: "積立", rows: [...D.tsumi, row] });
        if (int(t["月額"]) > 0) setTsumi(row.ID, row["開始月"], int(t["月額"]));
      } else act({ type: "save_table", table: "積立", rows: D.tsumi.map(x => x.ID === row.ID ? row : x) });
      closeModal(); toast(t.isNew ? "追加しました" : "保存しました"); break;
    }
    case "tdel": {
      const id = tDraft.ID, nm = tDraft["名前"];
      confirmBox(`「${esc(nm)}」と、その積立の記録を消しますか？`, "消す", () => {
        act({ type: "save_table", table: "積立", rows: D.tsumi.filter(x => x.ID !== id) });
        act({ type: "save_table", table: "積立記録", rows: D.tlog.filter(l => l["項目ID"] !== id) });
        toast("消しました");
      });
      break;
    }
    case "mclose": closeModal(); break;
    case "mok": closeModal(); if (confirmFn) confirmFn(); confirmFn = null; break;
    case "ck": S.ck = v; render(); break;
    case "cup": case "cdown": {
      const r = S.catDraft[S.ck], i = +b.dataset.i, j = a === "cup" ? i - 1 : i + 1;
      if (j < 0 || j >= r.length) return; [r[i], r[j]] = [r[j], r[i]]; render(true); break;
    }
    case "cdel": S.catDraft[S.ck].splice(+b.dataset.i, 1); render(true); break;
    case "cadd": S.catDraft[S.ck].push({ 種類: S.ck, 名前: "", アイコン: "i:tag" }); render(true);
      setTimeout(() => { const ins = appEl.querySelectorAll('[data-f="名前"]'); ins[ins.length - 1].focus(); }, 0); break;
    case "creset": S.catDraft = null; render(true); break;
    case "cicon": {
      const i = +b.dataset.i;
      modal(`<div class="title" style="margin-top:0">アイコンをえらぶ</div><div class="ipick">${Object.keys(CAT_ICON).map(k => `<button data-a="cpick" data-i="${i}" data-v="${k}" class="${iconKey(S.catDraft[S.ck][i]) === k ? "on" : ""}">${svgIcon(k)}</button>`).join("")}</div>
        <button class="btn" style="margin-top:14px" data-a="mclose">閉じる</button>`);
      break;
    }
    case "cpick": S.catDraft[S.ck][+b.dataset.i]["アイコン"] = "i:" + v; closeModal(); render(true); break;
    case "csave": {
      const rows = [];
      for (const k of [EXP, INC]) for (const c of S.catDraft[k]) if (String(c["名前"]).trim()) rows.push({ 種類: k, 名前: c["名前"].trim(), アイコン: "i:" + iconKey(c) });
      if (!rows.some(r => r["種類"] === EXP) || !rows.some(r => r["種類"] === INC)) { toast("支出と収入に1つずつは必要です"); return; }
      act({ type: "save_cats", rows }); S.catDraft = null; toast("カテゴリーを保存しました"); render(true); break;
    }
    case "logout": TOKEN.clear(); SL.value({ queue: QUEUE, logout: uid() }); break;
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.b) {
    if (t.dataset.b === "amount") { t.value = t.value.replace(/[^0-9]/g, ""); }
    S[t.dataset.b] = t.value;
    if (t.dataset.b === "date" && t.value) render(true);
  }
  if (t.dataset.t && tDraft) {
    if (["合計額", "月額", "payAmt"].includes(t.dataset.t)) t.value = t.value.replace(/[^0-9]/g, "");
    tDraft[t.dataset.t] = t.value;
    if (t.dataset.t === "合計額") fillAvg();
  }
  if (t.dataset.tsumi !== undefined) t.value = t.value.replace(/[^0-9]/g, "");
  if (t.dataset.c !== undefined && S.catDraft) S.catDraft[S.ck][+t.dataset.c][t.dataset.f] = t.value;
  if (t.dataset.bud !== undefined) t.value = t.value.replace(/[^0-9]/g, "");
  if (t.dataset.iname !== undefined && S.inDraft) S.inDraft[t.dataset.iname] = t.value;
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.tsumi !== undefined) {          // 積立の金額：入れた月から先に続く
    const it = D.tsumi.find(x => x.ID === t.dataset.tsumi); if (!it) return;
    const v = int(t.value); if (v === tAmt(it, S.month) && tLogs(it.ID, TSUMI).some(l => l["月"] === S.month)) return;
    if (v === tAmt(it, S.month) && t.value !== "") return;
    setTsumi(it.ID, S.month, v); toast(`${it["名前"]}：${+S.month.slice(5)}月から ${yen(v)}`);
  }
});

// ===== Streamlit から新しいデータが来たとき =====
let pendingRender = false;
window.addEventListener("message", e => {
  const m = e.data;
  if (!m || m.type !== "streamlit:render") return;
  const args = m.args || {};
  if (args.mode === "probe") {          // ログイン画面の見えない部品：保存した証明を Python に渡すだけ
    if (!window.__probed) { window.__probed = true; SL.value({ token: TOKEN.get() }); }
    return;
  }
  if (args.token) TOKEN.set(args.token);
  SERVER = args.data || SERVER;
  const done = new Set(args.done || []);
  QUEUE = QUEUE.filter(a => !done.has(a.id));
  document.getElementById("sync").style.display = QUEUE.length ? "block" : "none";
  rebuild();
  if (!window.__fillClean && SERVER.records.length) {       // 補填は収入に入れなくなったので、前に入れた分を消す
    window.__fillClean = true;
    SERVER.records.filter(r => String(r.ID).startsWith("fill-")).forEach(r => act({ type: "delete_record", rid: r.ID }));
  }
  SL.height();
  const el = document.activeElement;
  if (!firstRender && el && /INPUT|SELECT|TEXTAREA/.test(el.tagName)) { pendingRender = true; return; }   // 入力中は書きかえない
  if (S.view === "cats" && S.catDraft && !firstRender) return;                                          // 編集中の下書きを守る
  firstRender = false;
  if (!document.getElementById("modal").classList.contains("show")) render(true);
});
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender && !/INPUT|SELECT|TEXTAREA/.test((document.activeElement || {}).tagName || "")) { pendingRender = false; render(true); } }, 50));
window.addEventListener("resize", () => SL.height());
render();
// ===== キーボードが入力欄を隠さないように =====
// キーボードが出ると見える範囲がせまくなる（visualViewport）。フッターを隠して、入力中の欄が見える範囲に入るように画面を動かす
function keyboardHelper(getScroller) {
  const vv = () => { try { return window.parent.visualViewport || window.visualViewport; } catch (e) { return window.visualViewport; } };
  const typing = el => el && (el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && !["date", "checkbox", "radio", "button", "submit"].includes(el.type)));
  function fit() {
    const el = document.activeElement, sc = getScroller();
    if (!typing(el) || !sc) return;
    const v = vv(), top = (v ? v.offsetTop : 0) + 12, bottom = (v ? v.offsetTop + v.height : window.innerHeight) - 16;
    const r = el.getBoundingClientRect();
    if (r.bottom > bottom) sc.scrollTop += r.bottom - bottom;
    else if (r.top < top) sc.scrollTop -= top - r.top;
  }
  let t1, t2;
  document.addEventListener("focusin", e => {
    if (!typing(e.target)) return;
    document.body.classList.add("kbd");
    clearTimeout(t1); clearTimeout(t2);
    t1 = setTimeout(fit, 320); t2 = setTimeout(fit, 650);        // キーボードが出おわるのを待つ
  });
  document.addEventListener("focusout", () => setTimeout(() => { if (!typing(document.activeElement)) document.body.classList.remove("kbd"); }, 120));
  const v = vv();
  if (v) { v.addEventListener("resize", fit); v.addEventListener("scroll", fit); }
}
keyboardHelper(() => document.getElementById("scroll"));
SL.ready();
SL.height();
</script>
